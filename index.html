<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мои кредиты</title>
<meta name="description" content="Учёт кредитов, платежей и золота">
<meta name="theme-color" content="#11805A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Кредиты">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Golos+Text:wght@400;500;600&display=swap">
<style>
  html,body{margin:0}
  html{-webkit-text-size-adjust:100%}
  :root{padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
  img{max-width:100%}
  [hidden]{display:none!important}
  #installBar:not(:empty){margin-bottom:14px}
  .install{display:flex; align-items:center; gap:11px; background:var(--brand-weak); border:1px solid color-mix(in srgb,var(--brand) 30%,transparent); border-radius:14px; padding:12px 14px;}
  .install .it{flex:1; min-width:0; font-size:.9rem; color:var(--brand-ink); font-weight:600}
  .install .ib{font-family:var(--font-num); font-weight:700; background:var(--brand); color:#fff; border-radius:11px; padding:10px 15px; flex:none}
  .install .ix{flex:none; width:34px; height:34px; border-radius:9px; color:var(--brand-ink); background:transparent; border:none; font-size:1rem}
  :root{
    --font-num:'Manrope', system-ui, -apple-system, sans-serif;
    --font-body:'Golos Text', system-ui, -apple-system, sans-serif;
    --bg:#F5F4F0; --surface:#FFFFFF; --surface-2:#F3F2ED;
    --ink:#1A1D1C; --muted:#737975; --line:#EAE8E1;
    --brand:#11805A; --brand-ink:#0C6447; --brand-weak:#E6F1EB;
    --gold:#C8921E; --track:#E6E4DD;
    --warn:#A8690A; --warn-weak:#FBF0D8; --danger:#B8402C; --danger-weak:#FAE8E3;
    --shadow:0 1px 2px rgba(26,29,28,.04), 0 8px 24px rgba(26,29,28,.06);
    --shadow-lg:0 2px 8px rgba(26,29,28,.06), 0 18px 48px rgba(26,29,28,.10);
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#121614; --surface:#1A1F1D; --surface-2:#202623; --ink:#EAEDEB; --muted:#929995; --line:#29302C;
    --brand:#2FB27E; --brand-ink:#63CF9F; --brand-weak:#15302454; --gold:#E0B04A; --track:#2A312D;
    --warn:#E0A53E; --warn-weak:#2E2713; --danger:#E06A52; --danger-weak:#331F1B;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); --shadow-lg:0 2px 10px rgba(0,0,0,.4), 0 20px 50px rgba(0,0,0,.5); color-scheme:dark; }}
  :root[data-theme="dark"]{
    --bg:#121614; --surface:#1A1F1D; --surface-2:#202623; --ink:#EAEDEB; --muted:#929995; --line:#29302C;
    --brand:#2FB27E; --brand-ink:#63CF9F; --brand-weak:#15302454; --gold:#E0B04A; --track:#2A312D;
    --warn:#E0A53E; --warn-weak:#2E2713; --danger:#E06A52; --danger-weak:#331F1B;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); --shadow-lg:0 2px 10px rgba(0,0,0,.4), 0 20px 50px rgba(0,0,0,.5); color-scheme:dark; }

  *{box-sizing:border-box}
  body{background:var(--bg); color:var(--ink); font-family:var(--font-body); line-height:1.45; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:540px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); padding-block:16px 116px;}

  header{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:18px;}
  .title{font-family:var(--font-num); font-weight:800; font-size:1.32rem; letter-spacing:-.01em; min-width:0;}
  .title small{display:block; font-family:var(--font-body); font-weight:500; font-size:.76rem; color:var(--muted); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .hbtns{display:flex; gap:7px; flex:none;}

  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; font-family:var(--font-num); font-weight:700; border-radius:14px; padding:13px 18px; font-size:1rem; transition:transform .08s ease, filter .15s ease; min-height:50px;}
  .btn:active{transform:scale(.975)}
  .btn-primary{background:var(--brand); color:#fff;} .btn-primary:active{filter:brightness(.95)}
  .btn-ghost{background:var(--surface-2); color:var(--ink); border:1px solid var(--line);}
  .btn-danger{background:var(--danger-weak); color:var(--danger);} .btn-full{width:100%}
  .icon-btn{width:40px; height:40px; border-radius:11px; display:inline-flex; align-items:center; justify-content:center; background:var(--surface); border:1px solid var(--line); color:var(--ink); box-shadow:var(--shadow); flex:none;}
  .icon-btn:active{transform:scale(.94)} .icon-btn svg{width:18px; height:18px;}

  .ava{flex:none; width:44px; height:44px; border-radius:13px; display:inline-flex; align-items:center; justify-content:center; color:#fff; font-family:var(--font-num); font-weight:800; font-size:1.15rem; overflow:hidden; box-shadow:inset 0 1px 0 rgba(255,255,255,.16), inset 0 -2px 3px rgba(0,0,0,.08);}
  .ava.sm{width:30px; height:30px; border-radius:9px; font-size:.86rem;}
  .ava.gold{background:linear-gradient(135deg,#F0C64E,#C8921E); color:#4a3608;}
  .ava img{width:100%; height:100%; object-fit:cover; display:block;}
  .icon-row{display:flex; align-items:center; gap:10px;}
  .icon-up{flex:1; min-height:46px; padding:12px 14px; font-size:.95rem;}
  .icon-up input{display:none;}

  .hero{background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:22px 20px; box-shadow:var(--shadow-lg); margin-bottom:14px;}
  .hero-top{display:flex; align-items:center; gap:18px;} .hero-text{flex:1; min-width:0;}
  .hero .cap{font-size:.82rem; color:var(--muted); font-weight:500;}
  .hero .big{font-family:var(--font-num); font-weight:800; font-size:2.3rem; letter-spacing:-.025em; line-height:1.05; margin:3px 0 4px;}
  .hero .sub{font-size:.85rem; color:var(--muted);} .hero .sub b{color:var(--brand-ink); font-weight:600;}
  .hero-msg{margin-top:16px; background:var(--brand-weak); color:var(--brand-ink); border-radius:13px; padding:11px 14px; font-size:.9rem; font-weight:500; display:flex; gap:9px; align-items:center;}
  .hero-stats{display:flex; gap:10px; margin-top:12px;}
  .hero-stats > div{flex:1; min-width:0; background:var(--surface-2); border:1px solid var(--line); border-radius:13px; padding:11px 12px;}
  .hero-stats .num{display:block; font-family:var(--font-num); font-weight:800; font-size:1.02rem; font-variant-numeric:tabular-nums;}
  .hero-stats small{color:var(--muted); font-size:.74rem;}
  .strat{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px; box-shadow:var(--shadow);}
  .strat-desc{font-size:.82rem; color:var(--muted); margin:2px 0 12px;}
  .strat-list{display:flex; flex-direction:column; gap:8px;}
  .strat-item{display:flex; align-items:center; gap:11px; padding:10px 11px; border-radius:12px; background:var(--surface-2); border:1px solid var(--line);}
  .strat-item.first{background:var(--brand-weak); border-color:color-mix(in srgb,var(--brand) 35%,transparent);}
  .strat-rank{font-family:var(--font-num); font-weight:800; width:20px; text-align:center; color:var(--muted); flex:none;}
  .strat-item.first .strat-rank{color:var(--brand-ink);}
  .strat-nm{flex:1; min-width:0; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .strat-first-tag{font-family:var(--font-num); font-weight:700; font-size:.68rem; color:var(--brand-ink); background:var(--surface); padding:3px 8px; border-radius:99px; flex:none;}
  .strat-amt{font-family:var(--font-num); font-weight:700; font-variant-numeric:tabular-nums; font-size:.88rem; flex:none;}
  .strat-hint{font-size:.78rem; color:var(--muted); margin-top:10px;}
  .seg.seg4{flex-wrap:wrap;} .seg.seg4 button{flex:1 1 calc(50% - 4px);}

  .ring{position:relative; flex:none; width:84px; height:84px;}
  .ring svg{width:100%; height:100%; transform:rotate(-90deg); display:block;}
  .ring circle{fill:none; stroke-width:5;}
  .ring-track{stroke:color-mix(in srgb, var(--brand) 18%, transparent);}
  .ring-fill{stroke:var(--brand); stroke-linecap:round; transition:stroke-dashoffset 1s cubic-bezier(.2,.7,.2,1);}
  .ring-num{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:1px; font-family:var(--font-num); font-variant-numeric:tabular-nums; color:var(--ink);}
  .ring-num b{font-weight:800; font-size:1.35rem; line-height:1;} .ring-num i{font-style:normal; font-weight:700; font-size:.66rem; color:var(--muted); margin-top:4px;}
  .ring.lg{width:120px; height:120px;} .ring.lg .ring-num b{font-size:2rem;}
  @media (prefers-reduced-motion:reduce){ .ring-fill{transition:none} }

  .tip{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:11px 14px; margin-bottom:14px; font-size:.86rem; box-shadow:var(--shadow);}
  .tip .x{margin-left:auto; color:var(--muted); width:28px; height:28px; border-radius:8px; flex:none; display:inline-flex; align-items:center; justify-content:center; font-size:.9rem;}

  .nextpay{display:flex; align-items:center; gap:14px; border-radius:18px; padding:16px; margin-bottom:22px; box-shadow:var(--shadow); background:var(--surface); border:1px solid var(--line);}
  .nextpay.soon{background:var(--warn-weak); border-color:color-mix(in srgb,var(--warn) 28%,transparent);}
  .nextpay.urgent{background:var(--danger-weak); border-color:color-mix(in srgb,var(--danger) 32%,transparent);}
  .np-main{flex:1; min-width:0;}
  .np-cap{font-size:.76rem; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em;}
  .np-bank{display:flex; align-items:center; gap:9px; font-family:var(--font-num); font-weight:700; font-size:1.08rem; margin:5px 0 3px; min-width:0;}
  .np-bank span.nm{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .np-when{font-size:.84rem; color:var(--muted); font-weight:500;}
  .np-when.soon{color:var(--warn);} .np-when.urgent{color:var(--danger); font-weight:600;}
  .np-right{display:flex; flex-direction:column; align-items:flex-end; gap:8px; flex:none;}
  .np-amt{font-family:var(--font-num); font-weight:800; font-size:1.15rem; font-variant-numeric:tabular-nums;}
  .np-right .btn{padding:9px 16px; min-height:40px; font-size:.92rem; border-radius:12px;}
  .np-hint{font-size:.74rem; color:var(--muted); margin-top:4px; line-height:1.35;}
  .nextpay.chk{align-items:stretch;}
  .nextpay.chk .np-right{justify-content:center;}
  .nextpay.chk .np-right .btn{width:100%;}
  .c-sub .mo.od{color:var(--danger);}
  .linkbtn{display:block; margin:-4px auto 12px; background:none; border:0; color:var(--muted); font:inherit; font-size:.86rem; text-decoration:underline; text-underline-offset:3px; padding:8px; cursor:pointer;}
  .nextpay.calm{justify-content:center; text-align:center; color:var(--brand-ink); font-weight:600; background:var(--brand-weak); border-color:transparent; font-family:var(--font-num);}

  .section-h{display:flex; align-items:baseline; justify-content:space-between; margin:0 2px 12px;}
  .section-h h2{font-family:var(--font-num); font-weight:700; font-size:1.08rem;}
  .section-h .count{font-size:.82rem; color:var(--muted);}
  .add-link{font-family:var(--font-num); font-weight:700; color:var(--brand-ink); font-size:.88rem; padding:4px 2px;}

  .cards{display:flex; flex-direction:column; gap:10px;}
  .card{display:flex; align-items:center; gap:13px; width:100%; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:17px; padding:14px; box-shadow:var(--shadow); transition:transform .08s ease;}
  .card:active{transform:scale(.99)}
  .c-main{flex:1; min-width:0;}
  .c-top{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
  .c-name{font-family:var(--font-num); font-weight:700; font-size:1.05rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
  .c-name .gb{color:var(--gold); margin-left:5px; font-size:.82rem;}
  .c-rem{font-family:var(--font-num); font-weight:800; font-variant-numeric:tabular-nums; flex:none;}
  .c-rem.done{color:var(--brand-ink);}
  .cbar{height:7px; border-radius:99px; background:var(--track); overflow:hidden; margin:9px 0 7px;}
  .cbar > i{display:block; height:100%; border-radius:99px; background:var(--brand); width:0; transition:width .8s cubic-bezier(.2,.7,.2,1);}
  .c-sub{display:flex; justify-content:space-between; gap:10px; font-size:.78rem; color:var(--muted);}
  .c-sub .mo{color:var(--brand-ink); font-weight:600; font-family:var(--font-num);}
  .c-chev{flex:none; color:var(--muted); opacity:.6}
  @media (prefers-reduced-motion:reduce){ .cbar>i{transition:none} }

  .gold-card{background:var(--surface); border:1px solid var(--line); border-radius:17px; padding:16px; box-shadow:var(--shadow);}
  .gc-top{display:flex; align-items:center; gap:13px;}
  .gc-main{flex:1; min-width:0;}
  .gc-g{font-family:var(--font-num); font-weight:800; font-size:1.15rem;}
  .gc-cap{font-size:.78rem; color:var(--muted);}
  .gc-val{font-family:var(--font-num); font-weight:800; font-size:1.15rem; font-variant-numeric:tabular-nums; flex:none;}
  .gc-split{display:flex; gap:10px; margin-top:14px;}
  .gc-cell{flex:1; min-width:0; background:var(--surface-2); border:1px solid var(--line); border-radius:13px; padding:12px;}
  .gc-cell .k{font-size:.76rem; color:var(--muted);}
  .gc-cell .v{font-family:var(--font-num); font-weight:700; font-size:1.05rem; margin-top:3px; font-variant-numeric:tabular-nums;}
  .gc-cell .s{font-size:.78rem; color:var(--muted); font-variant-numeric:tabular-nums;}
  .gold-empty .c-name{font-family:var(--font-num); font-weight:700; font-size:1.02rem;}
  .card.closed{background:var(--surface-2); box-shadow:none; opacity:.9;}

  .tips{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px; box-shadow:var(--shadow);}
  .tips .tp-badge{display:inline-flex; align-items:center; gap:6px; font-family:var(--font-num); font-weight:700; font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; color:var(--brand-ink); background:var(--brand-weak); padding:5px 10px; border-radius:99px; margin-bottom:11px;}
  .tips h3{font-family:var(--font-num); font-weight:700; font-size:1.08rem; margin:0 0 5px;}
  .tips .tp-text{font-size:.9rem; color:var(--muted); margin:0 0 14px; line-height:1.5;}
  .tips .tp-actions{display:flex; gap:10px;}
  .tips .tp-actions .btn{flex:1; min-height:44px; padding:10px; font-size:.92rem;}
  .tip-item{padding:14px 0; border-top:1px solid var(--line);}
  .tip-item:first-of-type{border-top:none;}
  .tip-item h4{font-family:var(--font-num); font-weight:700; font-size:1rem; margin:0 0 5px; display:flex; gap:9px; align-items:baseline;}
  .tip-item .ti-n{color:var(--brand-ink); flex:none;}
  .tip-item p{font-size:.88rem; color:var(--muted); margin:0; line-height:1.5;}

  .dyn{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:18px; box-shadow:var(--shadow); margin-top:22px;}
  .dyn-h{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:3px;}
  .dyn-h h3{font-family:var(--font-num); font-weight:700; font-size:1.05rem;}
  .dyn-h .drop{font-family:var(--font-num); font-weight:800; font-size:.92rem; color:var(--brand-ink); font-variant-numeric:tabular-nums;}
  .dyn-sub{font-size:.8rem; color:var(--muted); margin-bottom:14px;}
  .chart{width:100%; height:auto; display:block;}
  .chart .line{fill:none; stroke:var(--brand); stroke-width:2.5; stroke-linejoin:round; stroke-linecap:round;}
  .chart .dot{fill:var(--brand); stroke:var(--surface); stroke-width:2.5;}
  .chart .gl{stroke:var(--line); stroke-width:1;}
  .chart text{fill:var(--muted); font-size:9px; font-family:var(--font-num);}
  .hist{margin-top:16px;}
  .hist h4{font-size:.74rem; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; margin:0 0 6px;}
  .hrow{display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--line); font-size:.9rem;}
  .hrow .hn{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .hrow .hd{color:var(--muted); font-size:.8rem;} .hrow .ha{font-family:var(--font-num); font-weight:700; color:var(--brand-ink); font-variant-numeric:tabular-nums;}

  .empty{text-align:center; padding:36px 20px; color:var(--muted);}
  .empty .em{font-size:2.1rem; margin-bottom:10px;} .empty p{margin:0 0 18px; font-size:.95rem;}
  .example-note{display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:18px; font-size:.82rem; color:var(--muted);}
  .example-note button{font-weight:700; color:var(--brand-ink); font-family:var(--font-num); text-decoration:underline;}
  .sync{display:flex; align-items:center; gap:7px; justify-content:center; margin-top:14px; font-size:.78rem; color:var(--muted); text-align:center;}
  .sync .dot{width:7px; height:7px; border-radius:50%; background:var(--brand); flex:none;}

  .fab{position:fixed; left:0; right:0; bottom:0; padding:12px 16px; padding-bottom:max(12px, env(safe-area-inset-bottom,0px)); padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); background:linear-gradient(to top, var(--bg) 60%, transparent); z-index:20;}
  .fab .inner{max-width:540px; margin:0 auto;}

  .overlay{position:fixed; inset:0; background:rgba(10,14,13,.5); z-index:40; display:none; align-items:flex-end; justify-content:center; backdrop-filter:blur(2px);}
  .overlay.open{display:flex;}
  .sheet{background:var(--surface); width:100%; max-width:540px; border-radius:24px 24px 0 0; padding:22px 20px; padding-bottom:max(22px, env(safe-area-inset-bottom,0px)); max-height:92vh; overflow-y:auto; box-shadow:0 -12px 44px rgba(0,0,0,.28); animation:rise .24s cubic-bezier(.2,.75,.2,1);}
  @media (min-width:540px){ .overlay{align-items:center;} .sheet{border-radius:24px; max-height:88vh;} }
  @keyframes rise{from{transform:translateY(26px); opacity:.5} to{transform:none; opacity:1}}
  @media (prefers-reduced-motion:reduce){ .sheet{animation:none} }

  .sheet h3{font-family:var(--font-num); font-weight:800; font-size:1.3rem; margin:0; display:flex; align-items:center; gap:11px;}
  .sheet .lead{color:var(--muted); font-size:.88rem; margin:4px 0 18px;}
  .detail-ring{display:flex; justify-content:center; margin:6px 0 18px;}
  .detail-grid{display:flex; gap:10px; margin-bottom:16px;}
  .dcell{flex:1; min-width:0; background:var(--surface-2); border:1px solid var(--line); border-radius:14px; padding:13px;}
  .dcell .k{font-size:.74rem; color:var(--muted);} .dcell .v{font-family:var(--font-num); font-weight:700; font-size:1.08rem; margin-top:3px; font-variant-numeric:tabular-nums;}
  .dcell .v.rem{color:var(--ink);} .dcell .v.rem.done{color:var(--brand-ink);}
  .dnext{display:flex; align-items:center; gap:9px; background:var(--surface-2); border:1px solid var(--line); border-radius:14px; padding:13px; margin-bottom:16px; font-size:.9rem;}
  .dnext .k{color:var(--muted);} .dnext .amt{margin-left:auto; font-family:var(--font-num); font-weight:700;}
  .dnext.soon{background:var(--warn-weak); border-color:transparent; color:var(--warn);} .dnext.urgent{background:var(--danger-weak); border-color:transparent; color:var(--danger);}
  .dnext.gold{background:color-mix(in srgb,var(--gold) 14%,var(--surface-2)); border-color:transparent; color:var(--ink);}
  .sheet-row{display:flex; gap:10px; margin-top:10px;} .sheet-row .btn{flex:1;}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:.82rem; font-weight:600; margin-bottom:6px;}
  .field .hint{font-weight:400; color:var(--muted);}
  .field input{width:100%; font-family:var(--font-body); font-size:1.05rem; color:var(--ink); background:var(--surface-2); border:1.5px solid var(--line); border-radius:12px; padding:13px 14px;}
  .field input:focus{outline:none; border-color:var(--brand);}
  .field.n input{font-family:var(--font-num); font-variant-numeric:tabular-nums;}
  .check{display:flex; align-items:center; gap:10px; cursor:pointer; font-size:.95rem; font-weight:500; padding:4px 0;}

«А сколько, если заплачу сразу?» Если дешевле — рассрочка не бесплатная."}, {"t": "Осторожно с рассрочками", "d": "Много маленьких рассрочек незаметно съедают бюджет. Считайте их как один большой долг."}, {"t": "Не будьте поручителем «по дружбе»", "d": "Если человек не заплатит — платить будете вы. Ваша подпись — ваш долг. Никому не отдавайте свои документы."}, {"t": "Бегите от микрозаймов", "d": "«Быстрые деньги» под огромный процент — прямая дорога в долговую яму."}]}, {"i": "🎯", "g": "Как выбраться из долгов", "items": [{"t": "Держите все долги на виду", "d": "Выпишите по каждому кредиту остаток, платёж, ставку, срок и залог. Когда видишь полную картину, легче планировать — для этого и приложение."}, {"t": "Сначала самый дорогой (лавина)", "d": "Платите минимум по всем, а все лишние деньги — на кредит с самой высокой ставкой. Так экономите больше всего."}, {"t": "Или сначала самый маленький (снежный ком)", "d": "Закрытие мелкого кредита даёт быструю победу и мотивацию. Выберите, что вам ближе."}, {"t": "⭐ Освободившийся платёж — на следующий долг", "d": "Когда закроется кредит, не тратьте освободившиеся деньги. Направьте всю эту сумму на следующий кредит — долги начнут падать как домино."}, {"t": "Платите чуть больше", "d": "Даже небольшая доплата заметно сокращает срок и переплату. Проверьте в калькуляторе «Досрочно»."}, {"t": "Пока есть долг под 18% — не инвестируйте", "d": "Погасить кредит под 18% — это гарантированные 18% выгоды без риска. Ни один вклад или бизнес столько гарантированно не даст."}, {"t": "Какой долг важнее", "d": "① под залог жилья → ② те, что могут дойти до суда → ③ самые дорогие → ④ родственникам и друзьям. Платите тому, кто опаснее, а не тому, кто громче требует."}, {"t": "Объедините дорогие кредиты", "d": "Спросите о рефинансировании — несколько дорогих кредитов в один подешевле. Только посчитайте комиссии."}, {"t": "Цель важнее суммы", "d": "Назовите дату, когда станете свободны от долгов, и идите к ней. Приложение её показывает."}]}, {"i": "🏦", "g": "Отношения с банком", "items": [{"t": "С банком можно торговаться", "d": "Условия банка — не закон. Можно попросить снизить ставку, дать отсрочку или реструктуризацию. Банку выгоднее договориться, чем потерять деньги."}, {"t": "⭐ Не можете заплатить — идите в банк заранее", "d": "Пока не просрочили, вы клиент с проблемой — банк готов обсуждать. После просрочки вы должник: пени, суд, залог. Звоните ДО даты платежа."}, {"t": "Платите вовремя", "d": "Просрочка добавляет штрафы и пени — они дороже процентов. Поставьте платёж в начало месяца как обязательный расход."}, {"t": "Автоплатёж защищает от штрафов", "d": "Настройте автоматическое списание. Одна забытая дата — пени и плохая кредитная история."}, {"t": "Проверяйте остаток раз в год", "d": "Возьмите в банке выписку. Бывают лишние комиссии, неучтённые платежи, навязанная страховка."}, {"t": "Кредитная история — это деньги", "d": "Платите вовремя — банки дадут больше и дешевле. Одна просрочка может стоить хорошей ставки в будущем."}]}, {"i": "🏠", "g": "Залог квартиры", "items": [{"t": "Чем меньше заняли от стоимости — тем безопаснее", "d": "Если кредит — треть стоимости квартиры, запас прочности большой. Банки обычно дают 50–70% от оценки."}, {"t": "Банк забирает только свой долг", "d": "Если дойдёт до продажи, банк возьмёт остаток долга с расходами, а остальные деньги вернёт вам."}, {"t": "Только настоящий договор залога", "d": "Не подписывайте договор купли-продажи вместо залога — это схема мошенников, так можно сразу лишиться квартиры."}, {"t": "Не закладывайте жильё частникам", "d": "Только проверенный банк. У частных лиц и микрофинансовых контор теряют квартиры из-за небольших долгов."}, {"t": "Не рискуйте единственным жильём", "d": "Не закладывайте его под рискованный бизнес. Спросите себя: потянем ли платёж, если доход упадёт на треть?"}, {"t": "Изъятие — крайняя мера", "d": "Банк не забирает квартиру из-за одного пропуска: сначала уведомления, обычно суд. Но продажа «с молотка» идёт дешевле рынка — лучше до этого не доводить."}, {"t": "Золото — на крайний случай", "d": "Залог под золото рискован: при просрочке можно потерять украшения. Помните об этом."}]}, {"i": "🏪", "g": "Бизнес и магазин", "items": [{"t": "⭐ Отсрочка у поставщика — бесплатный кредит", "d": "Договоритесь брать товар с оплатой через 30–60 дней. Продаёте и платите из выручки — без процентов. Это выгоднее кредита под 18%."}, {"t": "Знайте точку безубыточности", "d": "Сколько нужно продать за месяц, чтобы выйти в ноль. Без этого числа работаете вслепую — смотрите вкладку «Магазин»."}, {"t": "Наценка важнее оборота", "d": "Поднять цену на 10% обычно выгоднее, чем продать на 10% больше. Выручка тешит самолюбие, прибыль кормит семью."}, {"t": "Залежавшийся товар — замороженные деньги", "d": "Сезон прошёл — вещь подешевела навсегда, а проценты капают. Лучше распродать со скидкой и вернуть деньги в оборот."}, {"t": "Не расширяйтесь в долг", "d": "Вторая точка в кредит — частая причина краха. Расширяйтесь на прибыль, а не на заёмные деньги."}, {"t": "Деньги магазина и семьи — раздельно", "d": "Держите отдельно «оборот» и «неприкосновенные» накопления. Иначе непонятно, приносит ли дело прибыль."}, {"t": "Записывайте всё", "d": "Расходы, долги, договорённости с поставщиками — на бумаге или в переписке. «Договорились на словах» — источник потерь."}, {"t": "Не зависьте от одного", "d": "Один поставщик или один крупный покупатель — это хрупко. Всегда имейте запасной вариант."}]}, {"i": "💰", "g": "Привычки с деньгами", "items": [{"t": "Сначала заплатите себе", "d": "Получили доход — сразу отложите 5–10%, а живите на остальное. Даже малая сумма за год превращается в подушку."}, {"t": "Создайте запас", "d": "Отложите хотя бы на один месяц расходов, потом на 3–6. Запас спасает от новых кредитов при неожиданностях."}, {"t": "Правильный порядок", "d": "① минимальные платежи → ② маленький запас → ③ самый дорогой долг → ④ запас на 3–6 месяцев → ⑤ только потом вложения и крупные покупки."}, {"t": "Один «денежный день» в месяц", "d": "Например, 1-е число: смотрите остатки, платежи, что закрыли, сколько отложили. 30 минут — и всё под контролем."}, {"t": "Правило 24 часов", "d": "Хотите купить что-то без плана — подождите сутки. Половина желаний пройдёт сама."}, {"t": "Считайте цену в часах жизни", "d": "Разделите цену на свой доход в час. Вещь за 1 000 при доходе 50 в час — это 20 часов работы. Стоит ли?"}, {"t": "Повышайте уровень жизни медленнее дохода", "d": "Доход вырос — расходы выросли следом — денег опять нет. Разницу откладывайте."}, {"t": "Планируйте известные расходы", "d": "Свадьбы, школа, праздники, Рамазан, ремонт — не внезапны. Откладывайте понемногу заранее, и кредит не понадобится."}, {"t": "Актив или обязательство?", "d": "Актив приносит деньги, обязательство — забирает. Перед крупной покупкой спросите себя, что это будет."}, {"t": "Доход важнее экономии", "d": "Урезать расходы можно только до нуля, а доход можно растить без предела. Учитесь новому — это лучшая инвестиция."}, {"t": "Вся семья должна знать картину", "d": "Самое опасное — когда кредит берут молча. Пусть все, кто принимает решения, видят одну общую картину."}, {"t": "Деньги без дела дешевеют", "d": "Инфляция съедает накопления. Запас держите, но лишнее (после погашения долгов) должно работать."}, {"t": "Здоровье — тоже финансы", "d": "Болезнь — одна из главных причин долгов. Сон, еда и проверки у врача — это защита вашего дохода."}]}],

  tipGroups:[{"i": "📘", "g": "How loans work", "items": [{"t": "Overpayment is the price of money", "d": "Look past the rate to how much you'll repay in total. Ask for the \"full cost of credit\" — with fees and insurance it's often far above the advertised rate."}, {"t": "Early on you mostly pay interest", "d": "With equal (annuity) payments, the first months go almost entirely to interest, not the debt. That's why paying early is most valuable at the start."}, {"t": "Long term = bigger overpayment", "d": "The longer the term, the smaller the payment but the more you repay. 600,000 at 18% over 2 years costs about 120,000 extra; over 10 years about 700,000."}, {"t": "The rule of 72", "d": "Divide 72 by the rate to see how many years it takes to double. Unpaid debt at 18% doubles in 4 years (72 ÷ 18)."}, {"t": "Insurance is often pushed on you", "d": "The bank may bundle insurance into the loan. Ask if you can decline it — that makes the loan cheaper."}, {"t": "Secured vs unsecured", "d": "With collateral (home, gold, car) the rate is lower, but a missed payment can cost you the asset. Unsecured is pricier, but you only risk money."}]}, {"i": "✅", "g": "Rules of a smart borrower", "items": [{"t": "Borrow only for what earns money", "d": "Stock for the business, education, housing — yes. Phones, gadgets, wants — no: they lose value while the debt stays."}, {"t": "The 30–40% rule", "d": "Total monthly loan payments should stay under about a third of income. More than that is the danger zone."}, {"t": "Read the contract before signing", "d": "Fees, penalties, insurance, early-repayment terms — the costly parts hide in the small print."}, {"t": "Borrow in the currency you earn", "d": "Income in somoni and a loan in dollars is risky: when the exchange rate rises, so does the debt."}, {"t": "Don't pay a loan with a loan", "d": "A new loan to close an old one almost always grows your total debt. It's a closed loop."}, {"t": "\"0%\" instalments are never free", "d": "The interest is usually built into the price. Ask: \"How much if I pay in full now?\" If it's cheaper, the instalment isn't free."}, {"t": "Be careful with instalments", "d": "Many small instalments quietly eat your budget. Count them as one big debt."}, {"t": "Don't co-sign \"as a favour\"", "d": "If they don't pay, you will. Your signature is your debt. Never hand your documents to anyone."}, {"t": "Run from payday loans", "d": "\"Quick money\" at huge rates is a straight road into a debt pit."}]}, {"i": "🎯", "g": "Getting out of debt", "items": [{"t": "Keep all debts in sight", "d": "For each loan, note the balance, payment, rate, term and collateral. Seeing the full picture makes planning easier — that's what this app is for."}, {"t": "Highest rate first (avalanche)", "d": "Pay the minimum on everything and put all spare money on the highest-rate loan. That saves the most."}, {"t": "Or smallest first (snowball)", "d": "Closing a small loan gives a quick win and motivation. Pick what suits you."}, {"t": "⭐ Roll the freed payment into the next debt", "d": "When a loan closes, don't spend the freed money. Send all of it to the next loan — debts start falling like dominoes."}, {"t": "Pay a little extra", "d": "Even a small extra payment noticeably cuts the term and overpayment. Check the \"Early\" calculator."}, {"t": "Don't invest while carrying 18% debt", "d": "Paying off an 18% loan is a guaranteed, risk-free 18% return. No deposit or business guarantees that."}, {"t": "Which debt matters most", "d": "① secured on your home → ② those that can reach court → ③ the most expensive → ④ family and friends. Pay the most dangerous, not the loudest."}, {"t": "Combine expensive loans", "d": "Ask about refinancing — several costly loans into one cheaper one. Just count the fees."}, {"t": "The goal matters more than the amount", "d": "Name the date you'll be debt-free and work toward it. The app shows it."}]}, {"i": "🏦", "g": "Dealing with the bank", "items": [{"t": "You can negotiate with the bank", "d": "Bank terms aren't law. You can ask for a lower rate, a deferral or restructuring. The bank would rather make a deal than lose money."}, {"t": "⭐ Can't pay? Go to the bank early", "d": "Before you miss a payment you're a client with a problem — the bank will talk. After, you're a debtor: penalties, court, collateral. Call BEFORE the due date."}, {"t": "Pay on time", "d": "Late payments add penalties that cost more than interest. Treat the payment as a must-pay at the start of the month."}, {"t": "Autopay protects you from fines", "d": "Set up automatic payments. One forgotten date means penalties and a bad credit history."}, {"t": "Check your balance once a year", "d": "Get a statement from the bank. Extra fees, missed payments and unwanted insurance do happen."}, {"t": "Credit history is money", "d": "Pay on time and banks lend more, more cheaply. One late payment can cost you a good rate later."}]}, {"i": "🏠", "g": "Pledging your home", "items": [{"t": "The less you borrow against it, the safer", "d": "If the loan is a third of the home's value, your safety margin is big. Banks usually lend 50–70% of the valuation."}, {"t": "The bank only takes what it's owed", "d": "If it comes to a sale, the bank takes the remaining debt plus costs and returns the rest of the money to you."}, {"t": "Only a real pledge agreement", "d": "Never sign a sale contract instead of a pledge — it's a scam that can cost you the home immediately."}, {"t": "Never pledge your home to private lenders", "d": "Only a reputable bank. People lose homes to private lenders and microfinance firms over small debts."}, {"t": "Don't risk your only home", "d": "Don't pledge it for a risky business. Ask yourself: could we still pay if income dropped by a third?"}, {"t": "Repossession is the last resort", "d": "A bank won't take the home over one missed payment — first notices, usually court. But forced sales fetch below market, so don't let it get there."}, {"t": "Gold — only as a last resort", "d": "Pledging gold is risky: a missed payment can cost you the jewellery. Keep that in mind."}]}, {"i": "🏪", "g": "Business & shop", "items": [{"t": "⭐ Supplier credit is free credit", "d": "Arrange to take stock and pay in 30–60 days. You sell and pay from the takings — with no interest. Far better than an 18% loan."}, {"t": "Know your break-even point", "d": "How much you must sell each month to reach zero. Without this number you're working blind — see the \"Shop\" tab."}, {"t": "Margin beats turnover", "d": "Raising prices 10% usually beats selling 10% more. Revenue flatters the ego; profit feeds the family."}, {"t": "Old stock is frozen money", "d": "Once the season passes, an item loses value for good while interest keeps ticking. Better to sell at a discount and put the money back to work."}, {"t": "Don't expand on debt", "d": "A second shop on credit is a common cause of collapse. Grow from profit, not borrowed money."}, {"t": "Keep shop and family money apart", "d": "Hold \"working\" money and \"untouchable\" savings separately. Otherwise you can't tell whether the business makes a profit."}, {"t": "Write everything down", "d": "Expenses, debts, supplier deals — on paper or in messages. \"We agreed verbally\" is a source of losses."}, {"t": "Don't depend on just one", "d": "One supplier or one big customer is fragile. Always have a backup."}]}, {"i": "💰", "g": "Money habits", "items": [{"t": "Pay yourself first", "d": "When income arrives, set aside 5–10% right away and live on the rest. Even a small amount becomes a cushion within a year."}, {"t": "Build a cushion", "d": "Save at least one month of expenses, then 3–6. A cushion keeps surprises from pushing you into new loans."}, {"t": "The right order", "d": "① minimum payments → ② small cushion → ③ most expensive debt → ④ 3–6 month cushion → ⑤ only then investing and big purchases."}, {"t": "One \"money day\" a month", "d": "Say, the 1st: check balances, payments, what you closed, what you saved. 30 minutes and everything's under control."}, {"t": "The 24-hour rule", "d": "Want to buy something unplanned? Wait a day. Half the urges pass on their own."}, {"t": "Count price in hours of your life", "d": "Divide the price by your hourly income. A 1,000 item at 50 an hour is 20 hours of work. Worth it?"}, {"t": "Raise your lifestyle slower than your income", "d": "Income rises, spending follows, and there's no money again. Save the difference."}, {"t": "Plan the expenses you know are coming", "d": "Weddings, school, holidays, Ramadan, repairs aren't surprises. Save a little in advance and you won't need a loan."}, {"t": "Asset or liability?", "d": "An asset brings money in; a liability takes it out. Before a big purchase, ask which it will be."}, {"t": "Income matters more than saving", "d": "You can only cut costs to zero, but income can grow without limit. Learning new skills is the best investment."}, {"t": "The whole family should see the picture", "d": "The most dangerous thing is a loan taken quietly. Everyone who makes decisions should see one shared picture."}, {"t": "Idle money loses value", "d": "Inflation eats savings. Keep a cushion, but extra money (after debts) should work."}, {"t": "Health is finance too", "d": "Illness is a top cause of debt. Sleep, food and check-ups protect your income."}]}],

function clampDay(y,m,d){ const last=new Date(y,m+1,0).getDate(); return Math.min(d,last); }

  let y=t.getFullYear(),m=t.getMonth(),c=new Date(y,m,clampDay(y,m,dueDay)); if(c<t){ m+=1; if(m>11){m=0;y+=1;} c=new Date(y,m,clampDay(y,m,dueDay)); } return c; }
/* Периоды платежей. Номер месяца = год*12+месяц; loan.pt — последний оплаченный период.
   Дата погашения сама не «закрывает» месяц: пока платёж не отмечен, он считается просроченным. */
function mIdx(d){ return d.getFullYear()*12+d.getMonth(); }
function dueAt(idx,dueDay){ const y=Math.floor(idx/12), m=idx-y*12; return new Date(y,m,clampDay(y,m,dueDay)); }

function lastDueIdx(dueDay){ const t=today0(); let i=mIdx(t); if(dueAt(i,dueDay)>t) i--; return i; }
function curPt(loan){
  if(loan.pt!=null) return loan.pt;
  const dd=loan.dueDay||1, li=lastDueIdx(dd), from=dueAt(li,dd); from.setDate(from.getDate()-20);
  if(loan.example || state.payments.some(p=>p.loanId===loan.id && p.date>=ymd(from))) return li;
  return null;
}

function payoffSim(remaining, monthly, annualPct){
  if(remaining<=0) return {months:0, interest:0};
  if(monthly<=0) return null;
  const r=(annualPct||0)/100/12;
  if(r<=0) return {months:Math.ceil(remaining/monthly), interest:0};
  if(monthly <= remaining*r) return null;
  let bal=remaining, interest=0, months=0;
  while(bal>0 && months<1200){ const i=bal*r; interest+=i; bal=bal+i-monthly; months++; }
  return {months, interest:Math.max(0,Math.round(interest))};
}

const REMIND=7;
function analyze(loan){
  const total=Math.max(0,+loan.total||0), paid=Math.min(total,Math.max(0,+loan.paid||0)), remaining=Math.max(0,total-paid);
  const pct=total>0?Math.min(100,Math.round(paid/total*100)):0, done=remaining<=0, monthly=Math.max(0,+loan.monthly||0);
  const dd=loan.dueDay||1, pt=done?null:curPt(loan), check=!done&&pt==null;
  const per=done?null:(check?lastDueIdx(dd):pt+1), se=per!=null?schedAt(loan,per):null;
  const due=done?nextDueDate(dd):(se?parseYmd(se.d):dueAt(per,dd)), days=daysUntil(due), overdue=!done&&!check&&days<0;
  const amt=se?(+se.a||0):monthly;
  let monthsLeft=null, interestLeft=0;
  const sch=schedOf(loan);
  if(!done && sch){ const rest=sch.filter(e=>mIdx(parseYmd(e.d))>(pt!=null?pt:per-1)); monthsLeft=rest.length||null; interestLeft=Math.round(rest.reduce((s,e)=>s+(+e.i||0),0)); }
  else if(!done && monthly>0){ const sim=payoffSim(remaining,monthly,+loan.rate||0); if(sim){ monthsLeft=sim.months; interestLeft=sim.interest; } }
  let urg='none'; if(!done){ if(check)urg='soon'; else if(days<=3)urg='urgent'; else if(days<=REMIND)urg='soon'; }
  return {total,paid,remaining,pct,done,monthly,due,days,monthsLeft,interestLeft,urg,overdue,check,per,amt};
}

function fileToIconDataURL(file){
  return new Promise((resolve,reject)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{ try{
      const size=120, c=document.createElement('canvas'); c.width=size; c.height=size;
      const ctx=c.getContext('2d');
      const s=Math.min(img.naturalWidth,img.naturalHeight), sx=(img.naturalWidth-s)/2, sy=(img.naturalHeight-s)/2;
      ctx.drawImage(img,sx,sy,s,s,0,0,size,size);
      URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg',0.82));
    }catch(err){ URL.revokeObjectURL(url); reject(err); } };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('img')); };
    img.src=url;
  });
}

function dkey(d){ const x=d?new Date(d):new Date(); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); }
function dShort(k){ const p=String(k).split('-'); return (+p[2])+' '+MONTHS[lang].short[(+p[1])-1]; }

function shopRange(){
  const now=new Date(), t=dkey(now), dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  if(shopPer==='day') return {from:t,to:t,frac:1/dim};
  if(shopPer==='week'){ const f=new Date(now); f.setDate(f.getDate()-6); return {from:dkey(f),to:t,frac:7/dim}; }
  return {from:dkey(new Date(now.getFullYear(),now.getMonth(),1)),to:t,frac:1};
}

/* ---- данные и безопасность ---- */
const BKKEY='bk_v1', BKSN='bksn_v1', BKRH='bkrh_v1';
let storagePersisted=false;
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lastBackup(){ const v=+lsGet(BKKEY); return v>0?v:0; }
function markBackup(){ lsSet(BKKEY,String(Date.now())); lsSet(BKSN,'0'); renderBackupNudge(); }
function hasRealData(){ const sh=state.shop||{}; return state.loans.some(l=>!l.example)||!!(sh.exp&&sh.exp.length)||!!(sh.sales&&sh.sales.length)||!!(state.profile&&(state.profile.first||state.profile.last)); }
function onlyExamples(){ return state.loans.length>0 && state.loans.every(l=>l.example) && !hasRealData(); }
function bkDays(ts){ const a=new Date(ts); a.setHours(0,0,0,0); const b=new Date(); b.setHours(0,0,0,0); return Math.round((b-a)/86400000); }
function bkAgoText(ts){ const n=bkDays(ts); return n<=0?L.bkToday:n===1?L.bkYesterday:L.bkDaysAgo.replace('{n}',n); }
function bkDue(){ const last=lastBackup(); return hasRealData() && (!last || bkDays(last)>=7) && Date.now()>(+lsGet(BKSN)||0); }
function bkFileName(){ return 'my-credits-backup-'+dkey()+'.txt'; }
async function shareBackup(){
  const data=await backupDataFull();
  try{
    const f=new File([data],bkFileName(),{type:'text/plain'});
    if(navigator.canShare && navigator.share && navigator.canShare({files:[f]})){
      await navigator.share({files:[f], title:L.appName, text:L.bkShareText});
      markBackup(); toast(L.bkSaved); return;
    }
  }catch(e){ if(e && e.name==='AbortError') return; }
  downloadBackup();
}
async function downloadBackup(){
  try{
    const url=URL.createObjectURL(new Blob([await backupDataFull()],{type:'text/plain'}));
    const a=document.createElement('a'); a.href=url; a.download=bkFileName(); a.style.display='none';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),5000);
    markBackup(); toast(L.bkDownloaded);
  }catch(e){ toast(L.bkFail); }
}
function doRestore(str){
  let o; try{ o=JSON.parse(String(str).trim()); if(!o||!Array.isArray(o.loans)) throw 0; }catch(e){ toast(L.errBadBackup); return false; }
  const go=()=>{ restoreData(JSON.stringify(o)); closeSheet(); render(); toast(L.dataRestored); };
  if(hasRealData()){
    openSheet(`<h3>${L.bkReplaceQ}</h3><p class="lead">${L.bkReplaceSub}${o.at>0?' '+L.bkFileFrom.replace('{d}',fmtDate(new Date(o.at))):''}</p><div class="sheet-row" style="margin-top:16px"><button class="btn btn-ghost" data-close>${L.cancel}</button><button class="btn btn-primary" id="rs-go">${L.bkReplaceBtn}</button></div>`);
    $('#rs-go').onclick=go;
  } else go();
  return true;
}
function pickBackupFile(){
  const inp=document.createElement('input'); inp.type='file'; inp.style.display='none';
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; inp.remove(); if(!f) return; const r=new FileReader(); r.onload=()=>doRestore(r.result); r.onerror=()=>toast(L.errBadBackup); r.readAsText(f); };
  document.body.appendChild(inp); inp.click();
}
function renderBackupNudge(){
  const ex=onlyExamples() && lsGet(BKRH)!=='1', due=!ex && bkDue(), last=lastBackup();
  document.querySelectorAll('.bk-slot').forEach(box=>{
    if(ex && box.dataset.restore){
      box.innerHTML=`<div class="bkn rs"><div class="bkn-t"><span class="ic">🗂️</span><div><b>${L.bkRestoreTitle}</b><span class="s">${L.bkRestoreSub}</span></div></div><div class="bkn-a"><button class="btn btn-primary" data-bk="pick">${L.bkRestorePick}</button><button class="btn btn-ghost" data-bk="new">${L.bkNewUser}</button></div></div>`;
    } else if(due){
      box.innerHTML=`<div class="bkn"><div class="bkn-t"><span class="ic">🛡️</span><div><b>${last?L.bkRemindOld.replace('{d}',bkAgoText(last)):L.bkRemindNever}</b><span class="s">${L.bkRemindSub}</span></div></div><div class="bkn-a"><button class="btn btn-primary" data-bk="share">${L.bkNow}</button><button class="btn btn-ghost" data-bk="later">${L.bkLater}</button></div></div>`;
    } else box.innerHTML='';
  });
}

function backupData(){ return JSON.stringify({v:5, at:Date.now(), loans:state.loans, payments:state.payments, gold:state.gold, shop:state.shop, profile:state.profile, be:beLoad(), envTx:state.envTx, sup:state.sup, stock:state.stock, planB:state.planB, misc:state.misc}); }
async function backupDataFull(){ const o=JSON.parse(backupData()); const rc=await rcAll(); if(Object.keys(rc).length) o.rc=rc; return JSON.stringify(o); }
function restoreData(str){ const o=JSON.parse(str); if(!o||!Array.isArray(o.loans)) throw new Error('bad'); state.loans=o.loans; state.payments=Array.isArray(o.payments)?o.payments:[]; state.gold=o.gold||null; state.shop=(o.shop&&Array.isArray(o.shop.exp))?o.shop:{exp:[],sales:[]}; if(o.profile) state.profile=o.profile; if(o.be&&typeof o.be==='object') beSaveCfg(o.be); if(o.at>0) lsSet(BKKEY,String(o.at)); state.envTx=Array.isArray(o.envTx)?o.envTx:[]; state.sup=Array.isArray(o.sup)?o.sup:[]; state.stock=Array.isArray(o.stock)?o.stock:[]; state.planB=Array.isArray(o.planB)?o.planB:null; state.misc=(o.misc&&typeof o.misc==='object')?o.misc:{}; if(o.rc&&typeof o.rc==='object'){ for(const k in o.rc) rcPut(k,o.rc[k]); } persist(); }
function hashPin(p){ let h=5381; for(const c of String(p)) h=((h<<5)+h+c.charCodeAt(0))>>>0; return 'h'+h; }
function getPin(){ try{return localStorage.getItem('pin_v1')||'';}catch(e){return'';} }

function parseSchedule(text){
  const rows=[];
  for(const raw of String(text||'').split(/\n+/)){
    const line=raw.trim(); if(!line) continue;
    let m=line.match(/(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})/), d=null, rest=line;
    if(m){ let y=+m[3]; if(y<100) y+=2000; d=new Date(y,+m[2]-1,+m[1]); rest=line.replace(m[0],' '); }
    else { m=line.match(/(\d{4})-(\d{1,2})-(\d{1,2})/); if(m){ d=new Date(+m[1],+m[2]-1,+m[3]); rest=line.replace(m[0],' '); } }
    if(!d||isNaN(d)) continue;
    const nums=(rest.replace(/(\d)[\s ](?=\d{3}\b)/g,'$1').match(/\d+(?:[.,]\d+)?/g)||[]).map(x=>+x.replace(',','.')).filter(x=>x>0);
    if(!nums.length) continue;
    const e={d:ymd(d), a:nums[0]};
    if(nums.length>=3){ e.p=nums[1]; e.i=nums[2]; if(Math.abs(e.p+e.i-e.a)>Math.max(2,e.a*0.02)){ if(Math.abs(nums[0]+nums[1]-nums[2])<=Math.max(2,nums[2]*0.02)){ e.a=nums[2]; e.p=nums[0]; e.i=nums[1]; } } }
    rows.push(e);
  }
  rows.sort((x,y)=>x.d.localeCompare(y.d));
  return rows;
}

}

function famMerge(a,b){
  const del={...(a.del||{})}; for(const k in (b.del||{})) del[k]=Math.max(del[k]||0,b.del[k]);
  const c={}; const names=new Set([...Object.keys(a.c||{}),...Object.keys(b.c||{})]);
  for(const n of names){ const map=new Map();
    for(const r of ((a.c||{})[n]||[])) map.set(String(r.id),r);
    for(const r of ((b.c||{})[n]||[])){ const k=String(r.id), cur=map.get(k); if(!cur||(r._u||0)>=(cur._u||0)) map.set(k,r); }

}

/* ===================== v5: кредиты — детали, платёж, график, чеки ===================== */
function loanProgressCounts(loan,a){
  const s=schedOf(loan);
  if(s){ const pt=curPt(loan); const done=pt==null?s.filter(e=>parseYmd(e.d)<today0()).length:s.filter(e=>mIdx(parseYmd(e.d))<=pt).length; return {k:Math.min(done,s.length), m:s.length}; }
  if(+loan.term>0 && a.monthsLeft!=null){ const m=+loan.term; return {k:Math.max(0,Math.min(m,m-a.monthsLeft)), m}; }
  return null;
}
function penaltyPerDay(loan,a){ const pen=+loan.pen||0; if(!(pen>0)) return 0; return (a.amt||a.monthly||0)*pen/100; }

/* ===================== v5: деньги — копилка, конверты, нагрузка, прогноз ===================== */
function piggyPlan(list){
  const items=[];
  for(const {loan,a} of list){ if(loan.example||a.done||a.check) continue; if(a.days<=35) items.push({days:a.days, amt:a.amt||a.monthly||0, name:loan.name, due:a.due}); }
  for(const s of state.sup){ if(s.paid||!s.due) continue; const d=parseYmd(s.due), days=daysUntil(d); if(days<=35) items.push({days, amt:+s.sum||0, name:s.name, due:d}); }
  items.sort((x,y)=>x.days-y.days);
  const bal=envBal('loan'), over=items.filter(it=>it.days<0), fut=items.filter(it=>it.days>=0);
  const overSum=over.reduce((s,it)=>s+it.amt,0), left=Math.max(0,bal-overSum);
  let cum=0, perDay=0;
  for(const it of fut){ cum+=it.amt; const short=cum-left; if(short>0) perDay=Math.max(perDay, short/Math.max(1,it.days)); }
  const total=overSum+cum;
  return {items, bal, total, overSum, perDay:perDay>0?round10(perDay):0, need:Math.max(0,total-bal), next:fut[0]||null, over};
}
function streakMonths(){
  const list=activeList(); if(list.some(x=>x.a.overdue)) return 0;
  const pays=state.payments.filter(p=>p.per!=null&&!p.extra);
  const months=[...new Set(pays.map(p=>p.per))].sort((a,b)=>b-a);
  let n=0; for(const m of months){ if(pays.filter(p=>p.per===m).every(p=>!(p.late>0))) n++; else break; }
  return n;
}
/* ---- выручка и расходы магазина по месяцам ---- */
function monthStats(arr){ const m={}; for(const e of arr){ const k=String(e.date).slice(0,7); if(!m[k]) m[k]={sum:0,days:new Set()}; m[k].sum+=(+e.sum||0); m[k].days.add(e.date); } return m; }
function estMonthly(arr){
  const st=monthStats(arr), now=new Date(), vals=[]; let days=0;
  for(let i=1;i<=3;i++){ const k=monthKey(new Date(now.getFullYear(),now.getMonth()-i,1)); const x=st[k]; if(!x) continue; const n=x.days.size; days+=n; vals.push(n>=20?x.sum:x.sum/n*26); }
  if(vals.length) return {v:vals.reduce((s,v)=>s+v,0)/vals.length, n:days};
  const cur=st[monthKey(now)]; if(cur&&cur.days.size>=5) return {v:cur.sum/cur.days.size*26, n:cur.days.size};
  return null;
}
function revEst(){ return estMonthly(ensureShop().sales); }
function expEst(){ const e=estMonthly(ensureShop().exp); if(e) return e; const be=beLoad(); if(be){ const v=(+be.rent||0)+(+be.salary||0)+(+be.other||0); if(v>0) return {v, n:0, be:true}; } return null; }
function marginPct(){ const be=beLoad(); const m=be&&+be.margin; return m>0&&m<100?m:null; }
/* сколько по кредитам и поставщикам нужно в месяце idx (с учётом графиков) */
function dueInMonth(idx,list){
  let loans=0, sup=0; const rows=[];
  for(const {loan,a} of list){ if(loan.example||a.done) continue;
    const pt=curPt(loan), s=schedOf(loan);
    let amt=0, d=null;
    if(s){ const e=schedAt(loan,idx); if(e){ amt=+e.a||0; d=parseYmd(e.d); } }
    else { const lastIdx=(pt!=null?pt:lastDueIdx(loan.dueDay||1)-1)+(a.monthsLeft!=null?a.monthsLeft:600); if(idx<=lastIdx){ amt=a.monthly||0; d=dueAt(idx,loan.dueDay||1); } }
    if(amt>0){ const paid=pt!=null&&pt>=idx; loans+=amt; rows.push({kind:'loan',name:loan.name,amt,d,paid,id:loan.id}); }
  }
  for(const s of state.sup){ if(!s.due) continue; const d=parseYmd(s.due); if(mIdx(d)===idx){ sup+=(+s.sum||0); rows.push({kind:'sup',name:s.name,amt:+s.sum||0,d,paid:!!s.paid,id:s.id}); } }
  rows.sort((x,y)=>x.d-y.d);
  return {loans,sup,total:loans+sup,rows};
}

  const parts=[];
  // нагрузка
  if(loanM>0){
    if(rev&&rev.v>0){ const r=loanM/rev.v*100, zone=r<30?'ok':r<=40?'mid':'bad';

      parts.push(`<div class="pcard"><div class="pc-h"><span>⚖️ ${L.loadTitle}</span><b class="z-${zone}">${Math.round(r)}%</b></div>

  }
  // прогноз на 3 месяца
  if(rev&&rev.v>0){
    if(mg){
      const ex=exp?exp.v:0; let rows='', warn='';
      for(let k=0;k<3;k++){ const idx=cm+k, du=dueInMonth(idx,list); const net=rev.v*mg/100-ex-du.total;
        rows+=`<div class="fc-row ${net<0?'neg':''}"><span class="fc-m">${monthTitle(idx)}</span><span class="fc-v">${net>=0?'+':'−'}${money(Math.abs(net))}</span></div>`;

  }
  // бюджет закупки
  if(rev&&rev.v>0){
    const du=dueInMonth(cm,list), ex=exp?exp.v:0, goal=cushGoal(list), cb=envBal('cush');
    const top=cb<goal?Math.min(Math.round(rev.v*0.05),goal-cb):0;
    const budget=Math.max(0,rev.v-ex-du.total-top);
    parts.push(`<div class="pcard"><div class="pc-h"><span>🛒 ${L.buyTitle}</span><b>${money(budget)}</b></div>
      <div class="be-rows"><div class="be-row"><span>${L.buyRev}</span><b>${money(rev.v)}</b></div><div class="be-row"><span>− ${L.buyExp}</span><b>${money(ex)}</b></div><div class="be-row"><span>− ${L.buyLoans}</span><b>${money(du.total)}</b></div>${top>0?`<div class="be-row"><span>− ${L.buyCush}</span><b>${money(top)}</b></div>`:''}</div>
      <p class="pc-t">${L.buyText}</p>${envBal('stock')>0?`<p class="pc-t muted">${L.buyEnv(money(envBal('stock')))}</p>`:''}</div>`);
  }
  // сезонность
  const st=monthStats(ensureShop().sales), keys=[];
  for(let i=11;i>=0;i--) keys.push(monthKey(new Date(new Date().getFullYear(),new Date().getMonth()-i,1)));
  const vals=keys.map(k=>st[k]?st[k].sum:0), have=vals.filter(v=>v>0);
  if(have.length>=2){
    const avg=have.reduce((s,v)=>s+v,0)/have.length, mx=Math.max(...vals,1);
    const bars=keys.map((k,i)=>{ const v=vals[i], h=Math.round(v/mx*70), strong=v>avg*1.15, mm=+k.slice(5)-1; return `<div class="sb"><i class="${strong?'st':''}" style="height:${Math.max(2,h)}px"></i><small>${MONTHS[lang].short[mm]}</small></div>`; }).join('');
    const curV=st[monthKey(new Date())]?st[monthKey(new Date())].sum:0;
    const dim=new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate(), proj=curV/Math.max(1,new Date().getDate())*dim;
    const strongNow=have.length>=3&&proj>avg*1.15&&mg;
    const save=strongNow?round10(proj*mg/100*0.15):0;
    parts.push(`<div class="pcard"><div class="pc-h"><span>📈 ${L.seasonTitle}</span></div><div class="sbars" style="--avg:${Math.round(avg/mx*70)}px">${bars}</div><p class="pc-t muted">${L.seasonText(money(avg))}</p>
      ${strongNow?`<div class="pc-ok">${L.seasonStrong(money(save))} <button class="link-btn" data-env-add="season" data-amt="${save}">${L.seasonSaveBtn}</button></div>`:''}${have.length<3?`<p class="pc-src">${L.seasonMore}</p>`:''}</div>`);
  }
  // проценты, которые ещё уйдут банкам
  const act=list.filter(x=>!x.loan.example&&!x.a.done);
  const il=act.reduce((s,x)=>s+(x.a.interestLeft||0),0);
  if(il>0){ const top=[...act].filter(x=>+x.loan.rate>0&&x.a.monthly>0).sort((a,b)=>(+b.loan.rate)-(+a.loan.rate))[0]; let per1k=0;
    if(top){ const b0=payoffSim(top.a.remaining,top.a.monthly,+top.loan.rate), b1=payoffSim(Math.max(0,top.a.remaining-1000),top.a.monthly,+top.loan.rate); if(b0&&b1) per1k=Math.max(0,b0.interest-b1.interest); }
    parts.push(`<div class="pcard"><div class="pc-h"><span>💸 ${L.ilTitle}</span><b>${money(il)}</b></div><p class="pc-t">${L.ilText}</p>${per1k>0?`<div class="pc-ok">${L.ilPer1k(esc(top.loan.name),money(per1k))}</div>`:''}</div>`);
  }
  // конверты
  const goal=cushGoal(list);
  const envs=ENVS.map(e=>{ const b=envBal(e); const g=e==='cush'?goal:0; const pct=g>0?Math.min(100,Math.round(b/g*100)):0;
    return `<button class="envc" data-env="${e}"><span class="env-i">${ENV_IC[e]}</span><span class="env-n">${L['env_'+e]}</span><span class="env-b">${money(b)}</span>${g>0?`<span class="env-bar"><i style="width:${pct}%"></i></span><span class="env-g">${L.cushGoalT(money(g))}</span>`:''}</button>`; }).join('');
  parts.push(`<div class="section-h" style="margin-top:6px"><h2>${L.envTitle}</h2></div><p class="view-h">${L.envLead}</p><div class="envs">${envs}</div>`);
  box.innerHTML=parts.join('');
}

  const now=new Date(); let from,to,title;
  if(repMode==='month'){ const d=new Date(now.getFullYear(),now.getMonth()+repOff,1); from=dkey(d); to=dkey(new Date(d.getFullYear(),d.getMonth()+1,0)); title=L.monthsNom[d.getMonth()]+' '+d.getFullYear(); }
  else { const y=now.getFullYear()+repOff; from=y+'-01-01'; to=y+'-12-31'; title=String(y); }
  const inR=e=>e.date>=from&&e.date<=to, sh=ensureShop();
  const pays=state.payments.filter(inR).filter(p=>!state.loans.some(l=>l.example&&l.id===p.loanId)).sort((a,b)=>a.date.localeCompare(b.date));
  const byLoan={}; for(const p of pays){ const k=p.loanId; if(!byLoan[k]) byLoan[k]={amt:0,p:0,i:0,n:0}; byLoan[k].amt+=+p.amount||0; byLoan[k].p+=payPrincipal(p); byLoan[k].i+=+p.interest||0; byLoan[k].n++; }

}

  lock.querySelector('#lk-forgot').onclick=()=>{ lock.querySelector('#lk-help').hidden=false; };
  const hold=lock.querySelector('#lk-hold'); let ht=null, left=0;
  const stop=()=>{ clearInterval(ht); ht=null; hold.textContent=L.pinHold; };
  const start=e=>{ e.preventDefault(); left=5; hold.textContent=L.pinHoldN(left); ht=setInterval(()=>{ left--; if(left<=0){ stop(); clearPin(); lock.remove(); toast(L.pinRemoved); } else hold.textContent=L.pinHoldN(left); },1000); };

window.addEventListener('appinstalled', ()=>{ askPersist(); deferredPrompt=null; renderInstall(); toast(L.installedMsg); });
document.addEventListener('click', async e=>{
  if(e.target.closest('#installX')){ deferredPrompt=null; renderInstall(); return; }
  if(e.target.closest('#installBtn') && deferredPrompt){ const p=deferredPrompt; deferredPrompt=null; renderInstall(); try{ p.prompt(); await p.userChoice; }catch(_){} }
});
function initPWA(){ renderInstall(); askPersist(); if('serviceWorker' in navigator){ navigator.serviceWorker.register('service-worker.js').catch(()=>{}); } }

applyLook();
applyStatic();
render();
setTab(curTab);
maybeLock();
initPWA();
setTimeout(()=>{ try{ mirrorForSW(); pushRegister(false); if(famSt()) famSync(false); if(!handleGo()) maybeFreshStart(); }catch(e){} },400);
</script>
