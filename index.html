  const dates=[...new Set(sh.exp.map(e=>e.date).concat(sh.sales.map(e=>e.date)).concat(Object.keys(sh.notes||{}).filter(k=>sh.notes[k])))].sort().reverse();
  const row=d=>{ const rev=sumOf(sh.sales.filter(e=>e.date===d)), ex=sumOf(sh.exp.filter(e=>e.date===d)), lb=dayLabel(d), nt=(sh.notes&&sh.notes[d])||'', x=state.dayx[d];
    return `<button class="dy" data-day="${d}"><span class="dy-d"><b class="${lb.w?'w':''}">${esc(lb.b)}</b>${lb.s?`<small>${esc(lb.s)}</small>`:''}</span><span class="dy-m">${rev>0?`<span class="in">+${money(rev)}</span>`:`<span class="lbl">${L.dNoRev}</span>`}${ex>0?`<span class="out">−${money(ex)}</span>`:''}${x&&x.diff?`<span class="${x.diff<0?'out':'lbl'}">🧮 ${x.diff>0?'+':'−'}${money(Math.abs(x.diff))}</span>`:''}${nt?`<span class="lbl">📝 ${esc(nt)}</span>`:''}</span><span class="dy-c">›</span></button>`; };
  const days=dates.length?'<div class="dys">'+dates.slice(0,7).map(row).join('')+'</div>'+(dates.length>7?`<details class="more-days"><summary>${L.moreDays(Math.min(dates.length,60)-7)}</summary><div class="dys">${dates.slice(7,60).map(row).join('')}</div></details>`:''):`<div class="sh-empty">${esc(L.shopNoDays).replace(/\n/g,'<br>')}</div>`;
  return `<div class="sh-card">${shopSeg()}${main}${split}</div><div class="section-h" style="margin-top:22px"><h2>${L.shopDays}</h2></div>${days}`;

/* ---- голос: продиктовать выручку ---- */
function voiceOK(){ return !!(window.SpeechRecognition||window.webkitSpeechRecognition); }
function parseVoice(t){
  let s=String(t||'').toLowerCase().replace(/(\d)[\s ](?=\d{3}\b)/g,'$1');
  s=s.replace(/(\d+(?:[.,]\d+)?)\s*(тысяч[аи]?|тыс\.?|ҳазор|hazor|thousand|k\b)/g,(m,n)=>String(Math.round(parseFloat(n.replace(',','.'))*1000)));
  s=s.replace(/(^|\s)(тысяча|ҳазор|thousand)(?=\s|$)/g,'$1 1000');
  const L1='[а-яёӣӯҳқғҷa-z]*';
  const re=new RegExp('(\\d+(?:[.,]\\d+)?)|(налич'+L1+'|нақд'+L1+'|cash|кэш)|(перевод'+L1+'|перечисл'+L1+'|карт'+L1+'|корт'+L1+'|интиқол'+L1+'|transfer'+L1+'|card'+L1+'|онлайн)|(возврат'+L1+'|баргардон'+L1+'|вернул'+L1+'|return'+L1+')','g');
  const toks=[]; let m; while((m=re.exec(s))) toks.push(m[1]?{n:Math.round(parseFloat(m[1].replace(',','.')))}:{k:m[2]?'cash':m[3]?'card':'ret'});
  const suffix=toks.length>0&&toks[0].n!=null, out={};
  toks.forEach((x,i)=>{ if(x.n==null) return; let k=null; const nb=suffix?toks[i+1]:toks[i-1]; if(nb&&nb.k) k=nb.k; if(!k&&out.cash==null) k='cash'; if(k&&out[k]==null) out[k]=x.n; });
  return out;
}
function voiceFill(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; const hd=$('#dy-heard');
  if(!SR){ hd.hidden=false; hd.textContent=L.voiceNo; return; }
  const r=new SR(); r.lang=lang==='en'?'en-US':(lang==='tg'?'tg-TJ':'ru-RU'); r.interimResults=false; r.maxAlternatives=1;
  let tried=false; const mic=$('#dy-mic');
  r.onstart=()=>{ mic.classList.add('rec'); hd.hidden=false; hd.textContent=L.voiceListen; };
  r.onerror=e=>{ mic.classList.remove('rec'); if(!tried&&lang==='tg'&&(e.error==='language-not-supported'||e.error==='no-speech')){ tried=true; try{ r.lang='ru-RU'; r.start(); return; }catch(_){} } hd.textContent=e.error==='not-allowed'?L.voiceDenied:L.voiceFail; };
  r.onend=()=>mic.classList.remove('rec');
  r.onresult=e=>{ const t=e.results[0][0].transcript; const p=parseVoice(t);
    if(p.cash!=null) $('#dy-cash').value=p.cash; if(p.card!=null) $('#dy-card').value=p.card; if(p.ret!=null){ $('#dy-ret').value=p.ret; $('#dy-sr').open=true; }
    hd.innerHTML=`${L.voiceHeard}: «${esc(t)}»`+((p.cash==null&&p.card==null)?`<br>${L.voiceNoNum}`:'');
    sheet.querySelector('#dy-cash').dispatchEvent(new Event('input')); };
  try{ r.start(); }catch(e){ hd.hidden=false; hd.textContent=L.voiceFail; }
}

  const rows=state.cdebt.filter(r=>r.c===c.id).sort((a,b)=>a.d.localeCompare(b.d)||(a.ts||0)-(b.ts||0));
  let bal=0; for(const r of rows) bal+=r.t==='pay'?-(+r.a||0):(+r.a||0);
  let paid=rows.filter(r=>r.t==='pay').reduce((s,r)=>s+(+r.a||0),0), due=null;
  for(const r of rows.filter(r=>r.t!=='pay')){ if(paid>=(+r.a||0)){ paid-=(+r.a||0); continue; } due=r.due||null; break; }

  return {bal:Math.round(bal),due:bal>0?due:null,overdue:bal>0&&!!due&&due<dkey(),rows,lastPay};

function billDue(b){
  const now=today0(), y=now.getFullYear(), m=now.getMonth(), day=Math.min(28,Math.max(1,+b.day||1));
  const p=b.paid||{}; let k=monthKey(now);
  // самый ранний неоплаченный месяц с момента создания (не дальше 2 месяцев назад)
  for(let back=2;back>=1;back--){ const d=new Date(y,m-back,1), kk=monthKey(d); if(b.from&&kk<b.from) continue; if(!p[kk]){ const due=new Date(d.getFullYear(),d.getMonth(),day); return {due,days:daysUntil(due),paid:false,k:kk}; } }
  if(p[k]){ const d=new Date(y,m+1,day); return {due:d,days:daysUntil(d),paid:true,k:monthKey(d),paidAmt:p[k]}; }
  const due=new Date(y,m,day); return {due,days:daysUntil(due),paid:false,k};
}

/* ===================== v6: «Итоги» — неделя, год к году, дни недели, ABC, карточка месяца ===================== */
function weekStart(off){ const t=today0(); return addDays(t,-((t.getDay()+6)%7)-7*(off||0)); }
function weekData(off){
  const s=weekStart(off), e=addDays(s,6), from=dkey(s), to=dkey(e), sh=ensureShop(), inR=d=>d>=from&&d<=to;
  const byDay=[0,0,0,0,0,0,0]; for(const x of sh.sales){ if(inR(x.date)){ const i=Math.round((parseYmd(x.date)-s)/86400000); if(i>=0&&i<7) byDay[i]+=+x.sum||0; } }
  const rev=byDay.reduce((a,b)=>a+b,0), exp=sumOf(sh.exp.filter(x=>inR(x.date)));
  const logged=new Set(sh.sales.filter(x=>inR(x.date)).map(x=>x.date)).size;
  let bi=-1; byDay.forEach((v,i)=>{ if(v>0&&(bi<0||v>byDay[bi])) bi=i; });
  const paid=state.payments.filter(p=>inR(String(p.date))&&!state.loans.some(l=>l.example&&l.id===p.loanId)).reduce((a,p)=>a+(+p.amount||0),0);
  const saved=state.envTx.filter(t=>inR(String(t.d))&&t.a>0).reduce((a,t)=>a+(+t.a||0),0);
  const got=state.cdebt.filter(r=>r.t==='pay'&&inR(String(r.d))).reduce((a,r)=>a+(+r.a||0),0);
  const home=state.home.filter(h=>inR(String(h.d))).reduce((a,h)=>a+(+h.sum||0),0);
  let ret=0,def=0; for(const d in state.dayx) if(inR(d)){ ret+=+state.dayx[d].ret||0; def+=+state.dayx[d].def||0; }
  return {s,e,from,to,byDay,rev,exp,logged,best:bi,paid,saved,got,home,ret,def};
}
function pctCh(a,b){ if(!(b>0)) return null; return Math.round((a-b)/b*100); }
function wdOrder(i){ return (i+1)%7; } // 0=пн → индекс getDay
function renderWeekCard(){
  const box=$('#weekCard'); if(!box) return;

  const td=(today0().getDay()+6)%7, span=w.byDay[td]>0?td+1:td, pSame=p.byDay.slice(0,span).reduce((a,b)=>a+b,0), mx=Math.max(1,...w.byDay,...p.byDay), ch=pctCh(w.rev,pSame);

/* ---- лучшие дни недели ---- */
function bestWeekdays(){
  const sh=ensureShop(), from=dkey(addDays(today0(),-84)), by={}; for(const e of sh.sales){ if(e.date>=from&&e.date<dkey()) by[e.date]=(by[e.date]||0)+(+e.sum||0); }

/* ---- ABC: какие виды товара дают основную выручку ---- */
function abcData(days){
  const from=dkey(addDays(today0(),-(days||90))), by={}; let n=0;
  for(const d in state.dayx){ if(d<from) continue; const c=state.dayx[d].cats; if(!c) continue; n++; for(const k in c) by[k]=(by[k]||0)+(+c[k]||0); }
  const tot=Object.values(by).reduce((a,b)=>a+b,0); let cum=0;
  const rows=Object.keys(by).map(k=>({k,v:by[k]})).sort((a,b)=>b.v-a.v).map(r=>{ const prev=cum; cum+=r.v; const cls=prev/tot<0.8?'A':prev/tot<0.95?'B':'C'; return {...r,pc:Math.round(r.v/tot*100),cls}; });
  return {rows,tot,n};
}

  const pays=state.payments.filter(p=>inM(p.date)&&!state.loans.some(l=>l.example&&l.id===p.loanId));
  const paid=pays.reduce((s,p)=>s+(+p.amount||0),0), onTime=pays.filter(p=>p.per!=null&&!(p.late>0)).length, perN=pays.filter(p=>p.per!=null).length;

/* ---- голос: итог дня вслух ---- */
function speak(text,lg){
  if(!('speechSynthesis' in window)){ toast(L.voiceNoTTS); return; }
  try{ speechSynthesis.cancel(); const vs=speechSynthesis.getVoices(); const u=new SpeechSynthesisUtterance(text); const want=lg||(lang==='en'?'en':'ru');
    const v=vs.find(x=>String(x.lang).toLowerCase().startsWith(want)); if(v) u.voice=v; u.lang=want==='tg'?'tg-TJ':want==='en'?'en-US':'ru-RU'; u.rate=0.95; speechSynthesis.speak(u); }catch(e){ toast(L.voiceNoTTS); }
}
function daySpeech(LL){
  const sh=ensureShop(), t=dkey(), rev=sumOf(sh.sales.filter(e=>e.date===t)), ex=sumOf(sh.exp.filter(e=>e.date===t)), x=state.dayx[t]||{};
  const m=v=>nf.format(Math.round(v))+' '+LL.curWord;
  const parts=[LL.sayHello];
  if(rev>0||ex>0){ parts.push(LL.sayRev(m(rev))); if(x.cash||x.card) parts.push(LL.saySplit(m(x.cash||0),m(x.card||0))); if(ex>0) parts.push(LL.sayExp(m(ex))); if(x.act!=null) parts.push(Math.abs(x.diff||0)<1?LL.sayKassaOk:LL.sayKassa(m(Math.abs(x.diff)),x.diff<0)); }
  else parts.push(LL.sayNoDay);
  const nx=activeList().filter(y=>!y.loan.example&&!y.a.done&&!y.a.check).sort((a,b)=>a.a.days-b.a.days)[0];
  if(nx) parts.push(nx.a.overdue?LL.sayLate(nx.loan.name,m(nx.a.amt||nx.a.monthly||0)):LL.sayNext(nx.loan.name,fmtDate(nx.a.due),m(nx.a.amt||nx.a.monthly||0)));
  const debt=state.cust.reduce((s,c)=>s+Math.max(0,custState(c).bal),0); if(debt>0) parts.push(LL.sayOwed(m(debt)));
  parts.push(LL.sayBye);
  return parts.join(' ');
}
function weekSpeech(w,p){ const m=v=>nf.format(Math.round(v))+' '+L.curWord; const ch=pctCh(w.rev,p.rev); return L.sayWeek(m(w.rev),ch,w.best>=0?L.weekdays[wdOrder(w.best)]:'' ,m(w.exp)); }
function speakDay(){
  let lg=lang==='en'?'en':'ru', LL=L;
  if(lang==='tg'){ const vs=('speechSynthesis' in window)?speechSynthesis.getVoices():[]; if(vs.some(v=>String(v.lang).toLowerCase().startsWith('tg'))) lg='tg'; else { LL=D.ru; toast(L.voiceTgNo); } }
  const text=daySpeech(LL);
  openSheet(`<h3>🔊 ${L.qaSpeak}</h3><p class="lead">${esc(text)}</p><div class="sheet-row"><button class="btn btn-primary" id="sp-again">🔊 ${L.sayAgain}</button><button class="btn btn-ghost" id="sp-stop">⏹</button></div><div class="sheet-row"><button class="btn btn-ghost" data-close>${L.close}</button></div>`);
  $('#sp-again').onclick=()=>speak(text,lg); $('#sp-stop').onclick=()=>{ try{ speechSynthesis.cancel(); }catch(e){} };
  speak(text,lg);
}
try{ if('speechSynthesis' in window) speechSynthesis.getVoices(); }catch(e){}

document.addEventListener('click', e=>{
  const t=e.target, S=()=>e.stopImmediatePropagation();

    if(k==='pay') payPicker(); else if(k==='cust') debtForm(null,'debt'); else if(k==='home') homeForm(null); else if(k==='speak') speakDay(); else if(k==='voice'){ dayForm(); setTimeout(()=>{ const m=$('#dy-mic'); if(m) m.click(); },250); } return; }
  if(t.closest('[data-rates]')){ S(); const had=rates(); ratesSheet(); if(!had||had.day!==dkey()) fetchRates(false).then(r=>{ if(r&&(!had||had.day!==r.day)){ if(overlay.classList.contains('open')&&$('#rt-conv')) ratesSheet(); renderToday(activeList()); } }); return; }
  const hd=t.closest('[data-hdis]'); if(hd){ S(); let dis={}; try{ dis=JSON.parse(lsGet('hdis_v1')||'{}'); }catch(_){} dis[hd.dataset.hdis]=1; lsSet('hdis_v1',JSON.stringify(dis)); holidaysSheet(); render(); return; }
  const wk=t.closest('[data-week]'); if(wk){ S(); weeklySheet(+wk.dataset.week||0); return; }
  if(t.closest('[data-totips]')){ setTimeout(()=>{ const x=$('#tips'); if(x) x.scrollIntoView({behavior:'smooth'}); },60); }
}, true);

  if(e.target.closest('#tipX')){ try{localStorage.setItem('tip_v1','1');}catch(e){} renderTip(); return; }

  if(e.target.closest('#meBtn')){ profileForm(); return; }
  const tb=e.target.closest('[data-tab]'); if(tb){ setTab(tb.dataset.tab); return; }

    if(a==='goldedit'){ goldEditForm(); return; }
    if(a==='beedit'){ beEditForm(); return; }

    if(a==='open') detailSheet(loan); if(a==='pay') payForm(loan); if(a==='edit') loanForm(loan); if(a==='del') confirmDelete(loan); return; }
  if(e.target.closest('#langTop')) langSheet();
  if(e.target.closest('#dataTop')) dataSheet();
  if(e.target.closest('#calcTop')) calcSheet();

  if(e.target.closest('#clearEx')){ state.loans=[]; state.payments=[]; state.gold=null; persist(); render(); toast(L.saved); loanForm(null); }
});
document.addEventListener('keydown', e=>{ if((e.key==='Enter'||e.key===' ') && e.target.matches('.card[data-action]')){ e.preventDefault(); e.target.click(); } });

let tt; function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2200); }

/* ===== PWA: установка на телефон и офлайн ===== */
let deferredPrompt=null;
function renderInstall(){
  const bar=document.getElementById('installBar'); if(!bar) return;
  bar.innerHTML = deferredPrompt
    ? `<div class="install"><span style="font-size:1.3rem">📲</span><span class="it">${L.installText}</span><button class="ib" id="installBtn">${L.install}</button><button class="ix" id="installX" aria-label="×">✕</button></div>`
    : '';
}
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredPrompt=e; renderInstall(); });
window.addEventListener('appinstalled', ()=>{ askPersist(); deferredPrompt=null; renderInstall(); toast(L.installedMsg); });
document.addEventListener('click', async e=>{
  if(e.target.closest('#installX')){ deferredPrompt=null; renderInstall(); return; }
  if(e.target.closest('#installBtn') && deferredPrompt){ const p=deferredPrompt; deferredPrompt=null; renderInstall(); try{ p.prompt(); await p.userChoice; }catch(_){} }
});
function initPWA(){ renderInstall(); askPersist(); if('serviceWorker' in navigator){ navigator.serviceWorker.register('service-worker.js').catch(()=>{}); } }

applyLook();
applyStatic();
render();
setTab(curTab);
maybeLock();
initPWA();
setTimeout(()=>{ try{ mirrorForSW(); pushRegister(false); if(famSt()) famSync(false); if(!handleGo()){ if(!maybeWhatsNew()) maybeFreshStart(); } }catch(e){} fetchRates(false).then(()=>renderToday(activeList())).catch(()=>{}); },400);
