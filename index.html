<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мои кредиты</title>
<meta name="description" content="Учёт кредитов, платежей и золота">
<meta name="theme-color" content="#11805A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Кредиты">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Golos+Text:wght@400;500;600&display=swap">
<style>
  html,body{margin:0}
  html{-webkit-text-size-adjust:100%}
  :root{padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
  img{max-width:100%}
  [hidden]{display:none!important}
  #installBar:not(:empty){margin-bottom:14px}
  .install{display:flex; align-items:center; gap:11px; background:var(--brand-weak); border:1px solid color-mix(in srgb,var(--brand) 30%,transparent); border-radius:14px; padding:12px 14px;}
  .install .it{flex:1; min-width:0; font-size:.9rem; color:var(--brand-ink); font-weight:600}
  .install .ib{font-family:var(--font-num); font-weight:700; background:var(--brand); color:#fff; border-radius:11px; padding:10px 15px; flex:none}
  .install .ix{flex:none; width:34px; height:34px; border-radius:9px; color:var(--brand-ink); background:transparent; border:none; font-size:1rem}
  :root{
    --font-num:'Manrope', system-ui, -apple-system, sans-serif;
    --font-body:'Golos Text', system-ui, -apple-system, sans-serif;
    --bg:#F5F4F0; --surface:#FFFFFF; --surface-2:#F3F2ED;
    --ink:#1A1D1C; --muted:#737975; --line:#EAE8E1;
    --brand:#11805A; --brand-ink:#0C6447; --brand-weak:#E6F1EB;
    --gold:#C8921E; --track:#E6E4DD;
    --warn:#A8690A; --warn-weak:#FBF0D8; --danger:#B8402C; --danger-weak:#FAE8E3;
    --shadow:0 1px 2px rgba(26,29,28,.04), 0 8px 24px rgba(26,29,28,.06);
    --shadow-lg:0 2px 8px rgba(26,29,28,.06), 0 18px 48px rgba(26,29,28,.10);
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#121614; --surface:#1A1F1D; --surface-2:#202623; --ink:#EAEDEB; --muted:#929995; --line:#29302C;
    --brand:#2FB27E; --brand-ink:#63CF9F; --brand-weak:#15302454; --gold:#E0B04A; --track:#2A312D;
    --warn:#E0A53E; --warn-weak:#2E2713; --danger:#E06A52; --danger-weak:#331F1B;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); --shadow-lg:0 2px 10px rgba(0,0,0,.4), 0 20px 50px rgba(0,0,0,.5); color-scheme:dark; }}
  :root[data-theme="dark"]{
    --bg:#121614; --surface:#1A1F1D; --surface-2:#202623; --ink:#EAEDEB; --muted:#929995; --line:#29302C;
    --brand:#2FB27E; --brand-ink:#63CF9F; --brand-weak:#15302454; --gold:#E0B04A; --track:#2A312D;
    --warn:#E0A53E; --warn-weak:#2E2713; --danger:#E06A52; --danger-weak:#331F1B;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); --shadow-lg:0 2px 10px rgba(0,0,0,.4), 0 20px 50px rgba(0,0,0,.5); color-scheme:dark; }

  *{box-sizing:border-box}
  body{background:var(--bg); color:var(--ink); font-family:var(--font-body); line-height:1.45; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:540px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); padding-block:16px 116px;}

  header{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:18px;}
  .title{font-family:var(--font-num); font-weight:800; font-size:1.32rem; letter-spacing:-.01em; min-width:0;}
  .title small{display:block; font-family:var(--font-body); font-weight:500; font-size:.76rem; color:var(--muted); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .hbtns{display:flex; gap:7px; flex:none;}

  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; font-family:var(--font-num); font-weight:700; border-radius:14px; padding:13px 18px; font-size:1rem; transition:transform .08s ease, filter .15s ease; min-height:50px;}
  .btn:active{transform:scale(.975)}
  .btn-primary{background:var(--brand); color:#fff;} .btn-primary:active{filter:brightness(.95)}
  .btn-ghost{background:var(--surface-2); color:var(--ink); border:1px solid var(--line);}
  .btn-danger{background:var(--danger-weak); color:var(--danger);} .btn-full{width:100%}
  .icon-btn{width:40px; height:40px; border-radius:11px; display:inline-flex; align-items:center; justify-content:center; background:var(--surface); border:1px solid var(--line); color:var(--ink); box-shadow:var(--shadow); flex:none;}
  .icon-btn:active{transform:scale(.94)} .icon-btn svg{width:18px; height:18px;}

  .ava{flex:none; width:44px; height:44px; border-radius:13px; display:inline-flex; align-items:center; justify-content:center; color:#fff; font-family:var(--font-num); font-weight:800; font-size:1.15rem; overflow:hidden; box-shadow:inset 0 1px 0 rgba(255,255,255,.16), inset 0 -2px 3px rgba(0,0,0,.08);}
  .ava.sm{width:30px; height:30px; border-radius:9px; font-size:.86rem;}
  .ava.gold{background:linear-gradient(135deg,#F0C64E,#C8921E); color:#4a3608;}
  .ava img{width:100%; height:100%; object-fit:cover; display:block;}
  .icon-row{display:flex; align-items:center; gap:10px;}
  .icon-up{flex:1; min-height:46px; padding:12px 14px; font-size:.95rem;}
  .icon-up input{display:none;}

  .hero{background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:22px 20px; box-shadow:var(--shadow-lg); margin-bottom:14px;}
  .hero-top{display:flex; align-items:center; gap:18px;} .hero-text{flex:1; min-width:0;}
  .hero .cap{font-size:.82rem; color:var(--muted); font-weight:500;}
  .hero .big{font-family:var(--font-num); font-weight:800; font-size:2.3rem; letter-spacing:-.025em; line-height:1.05; margin:3px 0 4px;}
  .hero .sub{font-size:.85rem; color:var(--muted);} .hero .sub b{color:var(--brand-ink); font-weight:600;}
  .hero-msg{margin-top:16px; background:var(--brand-weak); color:var(--brand-ink); border-radius:13px; padding:11px 14px; font-size:.9rem; font-weight:500; display:flex; gap:9px; align-items:center;}
  .hero-stats{display:flex; gap:10px; margin-top:12px;}
  .hero-stats > div{flex:1; min-width:0; background:var(--surface-2); border:1px solid var(--line); border-radius:13px; padding:11px 12px;}
  .hero-stats .num{display:block; font-family:var(--font-num); font-weight:800; font-size:1.02rem; font-variant-numeric:tabular-nums;}
  .hero-stats small{color:var(--muted); font-size:.74rem;}
  .strat{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px; box-shadow:var(--shadow);}
  .strat-desc{font-size:.82rem; color:var(--muted); margin:2px 0 12px;}
  .strat-list{display:flex; flex-direction:column; gap:8px;}
  .strat-item{display:flex; align-items:center; gap:11px; padding:10px 11px; border-radius:12px; background:var(--surface-2); border:1px solid var(--line);}
  .strat-item.first{background:var(--brand-weak); border-color:color-mix(in srgb,var(--brand) 35%,transparent);}
  .strat-rank{font-family:var(--font-num); font-weight:800; width:20px; text-align:center; color:var(--muted); flex:none;}
  .strat-item.first .strat-rank{color:var(--brand-ink);}
  .strat-nm{flex:1; min-width:0; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .strat-first-tag{font-family:var(--font-num); font-weight:700; font-size:.68rem; color:var(--brand-ink); background:var(--surface); padding:3px 8px; border-radius:99px; flex:none;}
  .strat-amt{font-family:var(--font-num); font-weight:700; font-variant-numeric:tabular-nums; font-size:.88rem; flex:none;}
  .strat-hint{font-size:.78rem; color:var(--muted); margin-top:10px;}
  .seg.seg4{flex-wrap:wrap;} .seg.seg4 button{flex:1 1 calc(50% - 4px);}

  .ring{position:relative; flex:none; width:84px; height:84px;}
  .ring svg{width:100%; height:100%; transform:rotate(-90deg); display:block;}
  .ring circle{fill:none; stroke-width:5;}
  .ring-track{stroke:color-mix(in srgb, var(--brand) 18%, transparent);}
  .ring-fill{stroke:var(--brand); stroke-linecap:round; transition:stroke-dashoffset 1s cubic-bezier(.2,.7,.2,1);}
  .ring-num{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:1px; font-family:var(--font-num); font-variant-numeric:tabular-nums; color:var(--ink);}
  .ring-num b{font-weight:800; font-size:1.35rem; line-height:1;} .ring-num i{font-style:normal; font-weight:700; font-size:.66rem; color:var(--muted); margin-top:4px;}
  .ring.lg{width:120px; height:120px;} .ring.lg .ring-num b{font-size:2rem;}
  @media (prefers-reduced-motion:reduce){ .ring-fill{transition:none} }

  .tip{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:11px 14px; margin-bottom:14px; font-size:.86rem; box-shadow:var(--shadow);}
  .tip .x{margin-left:auto; color:var(--muted); width:28px; height:28px; border-radius:8px; flex:none; display:inline-flex; align-items:center; justify-content:center; font-size:.9rem;}

  .nextpay{display:flex; align-items:center; gap:14px; border-radius:18px; padding:16px; margin-bottom:22px; box-shadow:var(--shadow); background:var(--surface); border:1px solid var(--line);}
  .nextpay.soon{background:var(--warn-weak); border-color:color-mix(in srgb,var(--warn) 28%,transparent);}
  .nextpay.urgent{background:var(--danger-weak); border-color:color-mix(in srgb,var(--danger) 32%,transparent);}
  .np-main{flex:1; min-width:0;}
  .np-cap{font-size:.76rem; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em;}
  .np-bank{display:flex; align-items:center; gap:9px; font-family:var(--font-num); font-weight:700; font-size:1.08rem; margin:5px 0 3px; min-width:0;}
  .np-bank span.nm{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .np-when{font-size:.84rem; color:var(--muted); font-weight:500;}
  .np-when.soon{color:var(--warn);} .np-when.urgent{color:var(--danger); font-weight:600;}
  .np-right{display:flex; flex-direction:column; align-items:flex-end; gap:8px; flex:none;}
  .np-amt{font-family:var(--font-num); font-weight:800; font-size:1.15rem; font-variant-numeric:tabular-nums;}
  .np-right .btn{padding:9px 16px; min-height:40px; font-size:.92rem; border-radius:12px;}
  .nextpay.calm{justify-content:center; text-align:center; color:var(--brand-ink); font-weight:600; background:var(--brand-weak); border-color:transparent; font-family:var(--font-num);}

  .section-h{display:flex; align-items:baseline; justify-content:space-between; margin:0 2px 12px;}
  .section-h h2{font-family:var(--font-num); font-weight:700; font-size:1.08rem;}
  .section-h .count{font-size:.82rem; color:var(--muted);}
  .add-link{font-family:var(--font-num); font-weight:700; color:var(--brand-ink); font-size:.88rem; padding:4px 2px;}

  .cards{display:flex; flex-direction:column; gap:10px;}
  .card{display:flex; align-items:center; gap:13px; width:100%; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:17px; padding:14px; box-shadow:var(--shadow); transition:transform .08s ease;}
  .card:active{transform:scale(.99)}
  .c-main{flex:1; min-width:0;}
  .c-top{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
  .c-name{font-family:var(--font-num); font-weight:700; font-size:1.05rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
  .c-name .gb{color:var(--gold); margin-left:5px; font-size:.82rem;}
  .c-rem{font-family:var(--font-num); font-weight:800; font-variant-numeric:tabular-nums; flex:none;}
  .c-rem.done{color:var(--brand-ink);}
  .cbar{height:7px; border-radius:99px; background:var(--track); overflow:hidden; margin:9px 0 7px;}
  .cbar > i{display:block; height:100%; border-radius:99px; background:var(--brand); width:0; transition:width .8s cubic-bezier(.2,.7,.2,1);}
  .c-sub{display:flex; justify-content:space-between; gap:10px; font-size:.78rem; color:var(--muted);}
  .c-sub .mo{color:var(--brand-ink); font-weight:600; font-family:var(--font-num);}
  .c-chev{flex:none; color:var(--muted); opacity:.6}
  @media (prefers-reduced-motion:reduce){ .cbar>i{transition:none} }

  .gold-card{background:var(--surface); border:1px solid var(--line); border-radius:17px; padding:16px; box-shadow:var(--shadow);}
  .gc-top{display:flex; align-items:center; gap:13px;}
  .gc-main{flex:1; min-width:0;}
  .gc-g{font-family:var(--font-num); font-weight:800; font-size:1.15rem;}
  .gc-cap{font-size:.78rem; color:var(--muted);}
  .gc-val{font-family:var(--font-num); font-weight:800; font-size:1.15rem; font-variant-numeric:tabular-nums; flex:none;}
  .gc-split{display:flex; gap:10px; margin-top:14px;}
  .gc-cell{flex:1; min-width:0; background:var(--surface-2); border:1px solid var(--line); border-radius:13px; padding:12px;}
  .gc-cell .k{font-size:.76rem; color:var(--muted);}
  .gc-cell .v{font-family:var(--font-num); font-weight:700; font-size:1.05rem; margin-top:3px; font-variant-numeric:tabular-nums;}
  .gc-cell .s{font-size:.78rem; color:var(--muted); font-variant-numeric:tabular-nums;}
  .gold-empty .c-name{font-family:var(--font-num); font-weight:700; font-size:1.02rem;}
  .card.closed{background:var(--surface-2); box-shadow:none; opacity:.9;}

  .tips{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px; box-shadow:var(--shadow);}
  .tips .tp-badge{display:inline-flex; align-items:center; gap:6px; font-family:var(--font-num); font-weight:700; font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; color:var(--brand-ink); background:var(--brand-weak); padding:5px 10px; border-radius:99px; margin-bottom:11px;}
  .tips h3{font-family:var(--font-num); font-weight:700; font-size:1.08rem; margin:0 0 5px;}
  .tips .tp-text{font-size:.9rem; color:var(--muted); margin:0 0 14px; line-height:1.5;}
  .tips .tp-actions{display:flex; gap:10px;}
  .tips .tp-actions .btn{flex:1; min-height:44px; padding:10px; font-size:.92rem;}
  .tip-item{padding:14px 0; border-top:1px solid var(--line);}
  .tip-item:first-of-type{border-top:none;}
  .tip-item h4{font-family:var(--font-num); font-weight:700; font-size:1rem; margin:0 0 5px; display:flex; gap:9px; align-items:baseline;}
  .tip-item .ti-n{color:var(--brand-ink); flex:none;}
  .tip-item p{font-size:.88rem; color:var(--muted); margin:0; line-height:1.5;}

  .dyn{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:18px; box-shadow:var(--shadow); margin-top:22px;}
  .dyn-h{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:3px;}
  .dyn-h h3{font-family:var(--font-num); font-weight:700; font-size:1.05rem;}
  .dyn-h .drop{font-family:var(--font-num); font-weight:800; font-size:.92rem; color:var(--brand-ink); font-variant-numeric:tabular-nums;}
  .dyn-sub{font-size:.8rem; color:var(--muted); margin-bottom:14px;}
  .chart{width:100%; height:auto; display:block;}
  .chart .line{fill:none; stroke:var(--brand); stroke-width:2.5; stroke-linejoin:round; stroke-linecap:round;}
  .chart .dot{fill:var(--brand); stroke:var(--surface); stroke-width:2.5;}
  .chart .gl{stroke:var(--line); stroke-width:1;}
  .chart text{fill:var(--muted); font-size:9px; font-family:var(--font-num);}
  .hist{margin-top:16px;}
  .hist h4{font-size:.74rem; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; margin:0 0 6px;}
  .hrow{display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--line); font-size:.9rem;}
  .hrow .hn{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .hrow .hd{color:var(--muted); font-size:.8rem;} .hrow .ha{font-family:var(--font-num); font-weight:700; color:var(--brand-ink); font-variant-numeric:tabular-nums;}

  .empty{text-align:center; padding:36px 20px; color:var(--muted);}
  .empty .em{font-size:2.1rem; margin-bottom:10px;} .empty p{margin:0 0 18px; font-size:.95rem;}
  .example-note{display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:18px; font-size:.82rem; color:var(--muted);}
  .example-note button{font-weight:700; color:var(--brand-ink); font-family:var(--font-num); text-decoration:underline;}
  .sync{display:flex; align-items:center; gap:7px; justify-content:center; margin-top:14px; font-size:.78rem; color:var(--muted); text-align:center;}
  .sync .dot{width:7px; height:7px; border-radius:50%; background:var(--brand); flex:none;}

  .fab{position:fixed; left:0; right:0; bottom:0; padding:12px 16px; padding-bottom:max(12px, env(safe-area-inset-bottom,0px)); padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); background:linear-gradient(to top, var(--bg) 60%, transparent); z-index:20;}
  .fab .inner{max-width:540px; margin:0 auto;}

  .overlay{position:fixed; inset:0; background:rgba(10,14,13,.5); z-index:40; display:none; align-items:flex-end; justify-content:center; backdrop-filter:blur(2px);}
  .overlay.open{display:flex;}
  .sheet{background:var(--surface); width:100%; max-width:540px; border-radius:24px 24px 0 0; padding:22px 20px; padding-bottom:max(22px, env(safe-area-inset-bottom,0px)); max-height:92vh; overflow-y:auto; box-shadow:0 -12px 44px rgba(0,0,0,.28); animation:rise .24s cubic-bezier(.2,.75,.2,1);}
  @media (min-width:540px){ .overlay{align-items:center;} .sheet{border-radius:24px; max-height:88vh;} }
  @keyframes rise{from{transform:translateY(26px); opacity:.5} to{transform:none; opacity:1}}
  @media (prefers-reduced-motion:reduce){ .sheet{animation:none} }

  .sheet h3{font-family:var(--font-num); font-weight:800; font-size:1.3rem; margin:0; display:flex; align-items:center; gap:11px;}
  .sheet .lead{color:var(--muted); font-size:.88rem; margin:4px 0 18px;}
  .detail-ring{display:flex; justify-content:center; margin:6px 0 18px;}
  .detail-grid{display:flex; gap:10px; margin-bottom:16px;}
  .dcell{flex:1; min-width:0; background:var(--surface-2); border:1px solid var(--line); border-radius:14px; padding:13px;}
  .dcell .k{font-size:.74rem; color:var(--muted);} .dcell .v{font-family:var(--font-num); font-weight:700; font-size:1.08rem; margin-top:3px; font-variant-numeric:tabular-nums;}
  .dcell .v.rem{color:var(--danger);} .dcell .v.rem.done{color:var(--brand-ink);}
  .dnext{display:flex; align-items:center; gap:9px; background:var(--surface-2); border:1px solid var(--line); border-radius:14px; padding:13px; margin-bottom:16px; font-size:.9rem;}
  .dnext .k{color:var(--muted);} .dnext .amt{margin-left:auto; font-family:var(--font-num); font-weight:700;}
  .dnext.soon{background:var(--warn-weak); border-color:transparent; color:var(--warn);} .dnext.urgent{background:var(--danger-weak); border-color:transparent; color:var(--danger);}
  .dnext.gold{background:color-mix(in srgb,var(--gold) 14%,var(--surface-2)); border-color:transparent; color:var(--ink);}
  .sheet-row{display:flex; gap:10px; margin-top:10px;} .sheet-row .btn{flex:1;}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:.82rem; font-weight:600; margin-bottom:6px;}
  .field .hint{font-weight:400; color:var(--muted);}
  .field input{width:100%; font-family:var(--font-body); font-size:1.05rem; color:var(--ink); background:var(--surface-2); border:1.5px solid var(--line); border-radius:12px; padding:13px 14px;}
  .field input:focus{outline:none; border-color:var(--brand);}
  .field.n input{font-family:var(--font-num); font-variant-numeric:tabular-nums;}
  .check{display:flex; align-items:center; gap:10px; cursor:pointer; font-size:.95rem; font-weight:500; padding:4px 0;}
  .check input{width:20px; height:20px; accent-color:var(--brand); flex:none;}
  .two{display:flex; gap:10px;} .two .field{flex:1; min-width:0;}
  .err{color:var(--danger); font-size:.82rem; margin:-4px 0 12px; display:none;} .err.show{display:block;}

  /* Точка безубыточности */
  .be-card{background:var(--surface); border:1px solid var(--line); border-radius:17px; padding:16px; box-shadow:var(--shadow);}
  .be-cap{font-size:.74rem; color:var(--muted); font-weight:800; letter-spacing:.5px; text-transform:uppercase;}
  .be-big{font-family:var(--font-num); font-size:1.75rem; font-weight:800; letter-spacing:-.6px; margin-top:3px;}
  .be-sub{font-size:.84rem; color:var(--muted); font-weight:600; margin-top:2px;}
  .be-bar{height:9px; border-radius:99px; background:var(--surface-2); overflow:hidden; margin:14px 0 7px; display:flex;}
  .be-bar i{display:block; height:100%;}
  .be-leg{display:flex; gap:14px; flex-wrap:wrap; font-size:.76rem; color:var(--muted); font-weight:700;}
  .be-leg span{display:inline-flex; align-items:center; gap:5px;}
  .be-leg em{width:9px; height:9px; border-radius:3px; display:inline-block; font-style:normal;}
  .be-rows{margin-top:13px; border-top:1px solid var(--line); padding-top:8px;}
  .be-row{display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:5px 0; font-size:.92rem;}
  .be-row > span{color:var(--muted); font-weight:600;}
  .be-row > b{font-family:var(--font-num); font-weight:800;}
  .be-note{margin-top:11px; background:var(--brand-weak); border-radius:12px; padding:10px 12px; font-size:.83rem; color:var(--brand-ink); font-weight:600; line-height:1.5;}
  /* Нижняя панель разделов */
  :root{--navh:64px;}
  .bnav{position:fixed; left:0; right:0; bottom:0; z-index:25; display:flex; justify-content:center; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); box-shadow:0 -4px 18px rgba(0,0,0,.06);}
  .bnav .bn-in{display:flex; width:100%; max-width:540px;}
  .bnav button{flex:1; min-width:0; height:var(--navh); border:none; background:transparent; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-family:inherit; color:var(--muted); cursor:pointer; -webkit-tap-highlight-color:transparent; padding:0 2px;}
  .bnav .bi{font-size:1.2rem; line-height:1; width:48px; height:28px; display:flex; align-items:center; justify-content:center; border-radius:99px; filter:grayscale(.7); opacity:.7; transition:background .15s;}
  .bnav .bl{font-size:.68rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
  .bnav button.on{color:var(--brand-ink);}
  .bnav button.on .bi{background:var(--brand-weak); filter:none; opacity:1;}
  .bnav button.on .bl{font-weight:800;}
  .fab{bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px)); padding-bottom:10px;}
  .wrap{padding-block:16px calc(160px + env(safe-area-inset-bottom,0px));}
  .toast{bottom:calc(150px + env(safe-area-inset-bottom,0px));}
  .link-btn{border:none; background:none; color:var(--brand-ink); font-weight:800; font-family:inherit; font-size:inherit; padding:0; cursor:pointer; text-decoration:underline;}
  .day-btn{margin-top:16px; font-size:1rem; padding:14px;}
  /* Записать день */
  .dy-sec{background:var(--surface-2); border:1px solid var(--line); border-radius:14px; overflow:hidden;}
  .dy-sec.rev{background:var(--brand-weak); border-color:color-mix(in srgb,var(--brand) 30%,transparent); margin-bottom:16px;}
  .dy-row{display:flex; align-items:center; gap:10px; padding:7px 10px 7px 13px; border-bottom:1px solid var(--line); margin:0; cursor:text;}
  .dy-sec .dy-row:last-child{border-bottom:none;}
  .dy-n{flex:1; min-width:0; font-weight:700; font-size:.95rem;}
  .dy-sec.rev .dy-n{color:var(--brand-ink); font-size:1rem; font-weight:800;}
  .dy-row input{width:44%; max-width:160px; text-align:right; font-family:var(--font-num); font-weight:800; font-size:1.05rem; border:1.5px solid var(--line); background:var(--surface); border-radius:10px; padding:9px 10px; color:var(--ink);}
  .dy-row input:focus{outline:none; border-color:var(--brand);}
  .dy-row input::-webkit-outer-spin-button, .dy-row input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  .dy-row input[type=number]{-moz-appearance:textfield; appearance:textfield;}
  .dy-row input::placeholder{color:var(--muted); opacity:.35; font-weight:600;}
  .dy-h{font-size:.74rem; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin:0 2px 8px;}
  .dy-tot{display:flex; gap:10px; margin-top:12px;}
  .dy-tot > div{flex:1; background:var(--surface-2); border-radius:12px; padding:10px 12px;}
  .dy-tot small{display:block; font-size:.74rem; color:var(--muted); font-weight:700;}
  .dy-tot b{font-family:var(--font-num); font-size:1.1rem; font-weight:800;}
  .dy-tot .r b{color:var(--brand-ink);}
  .dy-hint{background:color-mix(in srgb,var(--gold) 18%,transparent); color:var(--ink); border-radius:11px; padding:9px 12px; font-size:.83rem; font-weight:700; margin:0 0 14px;}
  .dy-hint[hidden]{display:none;}
  /* Список по дням */
  .dys{display:flex; flex-direction:column; gap:8px;}
  .dy{display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:11px 13px; font-family:inherit; color:var(--ink); cursor:pointer; box-shadow:var(--shadow);}
  .dy:active{transform:scale(.99)}
  .dy-d{flex:none; min-width:50px; text-align:center; line-height:1.15;}
  .dy-d b{display:block; font-family:var(--font-num); font-size:1.2rem; font-weight:800;}
  .dy-d b.w{font-size:.84rem;}
  .dy-d small{font-size:.72rem; color:var(--muted); font-weight:700;}
  .dy-m{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;}
  .dy-m .in{font-family:var(--font-num); font-weight:800; color:var(--brand-ink);}
  .dy-m .out{font-family:var(--font-num); font-weight:700; color:var(--muted); font-size:.88rem;}
  .dy-m .lbl{font-size:.8rem; color:var(--muted); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .dy-c{flex:none; color:var(--muted); font-size:1.4rem; line-height:1;}
  /* Куда уходят деньги */
  .cb-h{font-size:.74rem; color:var(--muted); font-weight:800; letter-spacing:.5px; text-transform:uppercase; margin-top:18px;}
  .cb{margin-top:10px; display:flex; flex-direction:column; gap:12px;}
  .cb-r{display:grid; grid-template-columns:1fr auto; gap:5px 10px; align-items:center;}
  .cb-n{font-weight:700; font-size:.93rem;}
  .cb-p{color:var(--muted); font-weight:600; font-size:.8rem; margin-left:6px;}
  .cb-v{font-family:var(--font-num); font-weight:800; font-size:.93rem;}
  .cb-b{grid-column:1/-1; height:7px; border-radius:99px; background:var(--surface-2); overflow:hidden;}
  .cb-b i{display:block; height:100%; background:var(--gold); border-radius:99px;}
  /* Библиотека советов */
  .tg-wrap{display:flex; flex-direction:column; gap:10px; margin-top:16px;}
  .tg{background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); overflow:hidden;}
  .tg summary{list-style:none; display:flex; align-items:center; gap:11px; padding:14px 15px; cursor:pointer; font-weight:800; -webkit-tap-highlight-color:transparent;}
  .tg summary::-webkit-details-marker{display:none;}
  .tg summary::after{content:''; flex:none; width:8px; height:8px; border-right:2.2px solid var(--muted); border-bottom:2.2px solid var(--muted); transform:rotate(45deg); margin:0 3px 4px 2px; transition:transform .2s;}
  .tg[open] summary::after{transform:rotate(-135deg); margin-bottom:-2px;}
  .tg-i{font-size:1.25rem; flex:none;}
  .tg-t{flex:1; min-width:0; font-size:.95rem;}
  .tg-n{flex:none; font-size:.75rem; font-weight:800; color:var(--muted); background:var(--surface-2); border-radius:99px; padding:3px 9px;}
  .tg-list{border-top:1px solid var(--line); padding:2px 15px 6px;}
  .tg-it{padding:12px 0; border-bottom:1px solid var(--line);}
  .tg-it:last-child{border-bottom:none;}
  .tg-it b{display:block; font-size:.93rem; font-weight:800; margin-bottom:4px; line-height:1.35;}
  .tg-it p{margin:0; font-size:.88rem; color:var(--muted); line-height:1.55; font-weight:500;}
  /* Профиль */
  .hleft{display:flex; align-items:center; gap:10px; min-width:0; flex:1 1 auto;}
  .title span{display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .me-btn{flex:none; padding:0; border:none; background:transparent; cursor:pointer; border-radius:50%; line-height:0;}
  .me-ava{width:42px; height:42px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; background:var(--brand); color:#fff; font-family:var(--font-num); font-weight:800; font-size:1rem; overflow:hidden; box-shadow:0 0 0 2px var(--surface), 0 0 0 3.5px var(--line); flex:none;}
  .me-ava img{width:100%; height:100%; object-fit:cover; display:block;}
  .me-ava.noava{background:var(--surface-2); color:var(--muted);}
  .pf-top{display:flex; flex-direction:column; align-items:center; gap:12px; margin:6px 0 16px;}
  .pf-ava{width:92px; height:92px; font-size:1.9rem;}
  .pf-btns{display:flex; gap:8px; flex-wrap:wrap; justify-content:center;}
  .pf-btns .btn{padding:9px 14px; font-size:.86rem; width:auto;}
  @media (max-width:380px){ #addTop{display:none;} .title{font-size:1.12rem;} .hbtns{gap:5px;} .icon-btn{width:37px; height:37px;} .me-ava{width:38px; height:38px;} }
  /* Вкладки */
  .tabbar{position:sticky; top:0; z-index:30; display:flex; gap:4px; background:var(--surface-2); border:1px solid var(--line); padding:4px; border-radius:15px; margin:0 0 18px; box-shadow:var(--shadow);}
  .tabbar button{flex:1; border:none; background:transparent; padding:10px 4px; border-radius:11px; font-weight:800; font-size:.88rem; color:var(--muted); font-family:inherit; white-space:nowrap; cursor:pointer;}
  .tabbar button.on{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.1);}
  .view[hidden], .be-note[hidden]{display:none !important;}
  .view-h{font-size:.86rem; color:var(--muted); font-weight:600; margin:-8px 2px 14px; line-height:1.5;}
  /* Дневник магазина */
  .sh-card{background:var(--surface); border:1px solid var(--line); border-radius:17px; padding:16px; box-shadow:var(--shadow);}
  .sh-cap{font-size:.74rem; color:var(--muted); font-weight:800; letter-spacing:.5px; text-transform:uppercase;}
  .sh-big{font-family:var(--font-num); font-size:1.75rem; font-weight:800; letter-spacing:-.6px; margin-top:3px;}
  .sh-big.ok{color:var(--brand-ink);}
  .sh-sub{font-size:.84rem; color:var(--muted); font-weight:600; margin-top:2px;}
  .sh-bar{height:9px; border-radius:99px; background:var(--surface-2); overflow:hidden; margin:13px 0 4px;}
  .sh-bar i{display:block; height:100%; background:var(--brand); border-radius:99px; transition:width .5s ease;}
  .sh-rows{margin-top:12px; border-top:1px solid var(--line); padding-top:8px;}
  .sh-row{display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:5px 0; font-size:.92rem;}
  .sh-row > span{color:var(--muted); font-weight:600;}
  .sh-row > b{font-family:var(--font-num); font-weight:800;}
  .sh-row.pos > b{color:var(--brand-ink);} .sh-row.neg > b{color:#C0392B;}
  .sh-btns{display:flex; gap:9px; margin-top:14px;}
  .sh-btns button{flex:1; border:1.5px solid var(--line); background:var(--surface-2); border-radius:13px; padding:12px 8px; font-weight:800; font-size:.9rem; color:var(--ink); font-family:inherit;}
  .sh-btns button.pri{background:var(--brand); color:#fff; border-color:var(--brand);}
  .sh-btns button:active{transform:scale(.97)}
  .sh-ask{display:flex; align-items:center; gap:10px; background:var(--brand-weak); border-radius:13px; padding:10px 12px; margin-top:12px; font-size:.85rem; color:var(--brand-ink); font-weight:700;}
  .sh-ask button{margin-left:auto; flex:none; background:var(--brand); color:#fff; border:none; border-radius:10px; padding:8px 13px; font-weight:800; font-family:inherit; font-size:.82rem;}
  .sh-list{margin-top:13px; border-top:1px solid var(--line); padding-top:7px;}
  .sh-it{display:flex; align-items:center; gap:10px; padding:7px 0; font-size:.9rem;}
  .sh-it .d{color:var(--muted); font-size:.78rem; font-weight:700; min-width:42px; font-family:var(--font-num);}
  .sh-it .n{flex:1; min-width:0; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .sh-it .v{font-family:var(--font-num); font-weight:800;}
  .sh-it .v.in{color:var(--brand-ink);}
  .sh-it .x{border:none; background:transparent; color:var(--muted); font-size:1.15rem; padding:0 1px; line-height:1; flex:none;}
  .sh-empty{color:var(--muted); font-size:.87rem; font-weight:600; text-align:center; padding:14px 4px; line-height:1.5;}
  .cat-pick{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:14px;}
  .cat-pick button{border:1.5px solid var(--line); background:var(--surface-2); border-radius:11px; padding:8px 11px; font-size:.84rem; font-weight:700; color:var(--ink); font-family:inherit;}
  .cat-pick button.on{border-color:var(--brand); background:var(--brand-weak); color:var(--brand-ink);}
  .calc-out{background:var(--surface-2); border:1px solid var(--line); border-radius:14px; padding:2px 14px; margin:6px 0 16px;}
  .co-row{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--line); font-size:.92rem;}
  .co-row:first-child{border-top:none;} .co-row span{color:var(--muted);}
  .co-row b{font-family:var(--font-num); font-weight:700; font-variant-numeric:tabular-nums; font-size:1.05rem;}
  .co-row.big b{color:var(--brand-ink); font-size:1.25rem;}
  .seg{display:flex; gap:8px; margin-bottom:16px;}
  .seg button{flex:1; font-family:var(--font-num); font-weight:700; font-size:.92rem; padding:11px; border-radius:12px; background:var(--surface-2); border:1.5px solid var(--line); color:var(--muted);}
  .seg button.on{background:var(--brand-weak); border-color:var(--brand); color:var(--brand-ink);}
  .cur-pick{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:14px;}
  .cur-pick button{font-family:var(--font-num); font-weight:700; font-size:.9rem; padding:9px 14px; border-radius:11px; background:var(--surface-2); border:1.5px solid var(--line); color:var(--ink);}
  .cur-pick button.on{background:var(--brand-weak); border-color:var(--brand); color:var(--brand-ink);}

  .langlist{display:flex; flex-direction:column; gap:8px; margin-bottom:6px;}
  .langbtn{font-family:var(--font-num); font-weight:700; font-size:1.02rem; text-align:left; padding:14px 16px; border-radius:13px; background:var(--surface-2); border:1.5px solid var(--line); color:var(--ink);}
  .langbtn.on{background:var(--brand-weak); border-color:var(--brand); color:var(--brand-ink);}

  .ta{width:100%; font-family:var(--font-num); font-size:.84rem; color:var(--ink); background:var(--surface-2); border:1.5px solid var(--line); border-radius:12px; padding:11px 12px; resize:vertical; min-height:68px; word-break:break-all; line-height:1.4;}
  .ta:focus{outline:none; border-color:var(--brand);}
  .note{font-size:.8rem; color:var(--muted); margin:8px 0 0; line-height:1.45;}
  .bkn{display:flex; flex-direction:column; gap:11px; background:var(--warn-weak); border:1px solid color-mix(in srgb,var(--warn) 32%,transparent); border-radius:16px; padding:13px 14px; margin-bottom:14px;}
  .bkn.rs{background:var(--brand-weak); border-color:color-mix(in srgb,var(--brand) 30%,transparent);}
  .bkn-t{display:flex; gap:10px; align-items:flex-start;} .bkn-t .ic{font-size:1.35rem; line-height:1.1; flex:none}
  .bkn-t b{display:block; font-family:var(--font-num); font-weight:700; font-size:.95rem; margin-bottom:3px; color:var(--ink)} .bkn-t span.s{display:block; font-size:.82rem; color:var(--muted); line-height:1.4}
  .bkn-a{display:flex; gap:8px} .bkn-a .btn{padding:10px 14px; font-size:.9rem; border-radius:12px; min-height:44px} .bkn-a .btn-primary{flex:1}
  .bk-status{display:flex; align-items:center; gap:8px; font-size:.88rem; font-weight:600; padding:11px 13px; border-radius:12px; margin-bottom:12px; color:var(--ink)}
  .bk-status.ok{background:var(--brand-weak)} .bk-status.warn{background:var(--warn-weak)}
  .note.ok{color:var(--brand-ink); font-weight:600}
  .bk-more{margin-top:18px; border-top:1px solid var(--line); padding-top:12px} .bk-more summary{font-size:.86rem; font-weight:600; color:var(--muted); cursor:pointer; padding:6px 0; list-style-position:inside}
  .bk-more[open] summary{margin-bottom:8px}
  .sec-block{margin-top:20px; padding-top:18px; border-top:1px solid var(--line);} .sec-block > label{font-size:.82rem; font-weight:600; display:block; margin-bottom:8px;}

  .lock{position:fixed; inset:0; background:var(--bg); z-index:90; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; padding-top:max(24px, env(safe-area-inset-top,0px));}
  .lock .lk-t{font-family:var(--font-num); font-weight:800; font-size:1.3rem;}
  .lock input{width:170px; text-align:center; letter-spacing:.4em; font-size:1.6rem; font-family:var(--font-num); background:var(--surface-2); border:1.5px solid var(--line); border-radius:14px; padding:14px; color:var(--ink);}
  .lock input:focus{outline:none; border-color:var(--brand);} .lock .lk-e{color:var(--danger); font-size:.85rem; min-height:1.1em;}

  .toast{position:fixed; left:50%; transform:translateX(-50%) translateY(20px); bottom:96px; background:var(--ink); color:var(--bg); font-family:var(--font-num); font-weight:600; font-size:.9rem; padding:12px 20px; border-radius:99px; z-index:100; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; max-width:88%; text-align:center;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  :focus-visible{outline:2.5px solid var(--brand); outline-offset:2px; border-radius:8px;}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="hleft"><button class="me-btn" id="meBtn" aria-label="Профиль"><span class="me-ava noava" id="meAva"></span></button><div class="title"><span id="appTitle">Мои кредиты</span><small id="appSub">Банки и платежи</small></div></div>
    <div class="hbtns">
      <button class="icon-btn" id="langTop" aria-label="Язык"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 2.5 15 0 18M12 3c-2.5 2.5-2.5 15 0 18"/></svg></button>
      <button class="icon-btn" id="dataTop" aria-label="Данные"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9.5 12l1.8 1.8 3.2-3.6"/></svg></button>
      <button class="icon-btn" id="calcTop" aria-label="Калькулятор"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M8 7h8M8 11h.01M12 11h.01M16 11v6M8 15h.01M12 15h.01M8 18h.01M12 18h.01"/></svg></button>
      <button class="icon-btn" id="addTop" aria-label="Добавить банк"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
  </header>

  <div class="view" id="view-loans">
    <div class="bk-slot" data-restore="1"></div>
    <section id="hero"></section>
    <div id="tip"></div>
    <section id="nextPay"></section>

    <div class="section-h"><h2 id="myBanksH2">Мои банки</h2><span class="count" id="bankCount"></span></div>
    <div id="cards" class="cards"></div>

    <section id="strategy" style="margin-top:22px"></section>
    <section id="goldSection" style="margin-top:22px"></section>
    <section id="dynamics"></section>
    <section id="closed" style="margin-top:22px"></section>
    <div id="exampleNote"></div>
  </div>

  <div class="view" id="view-shop" hidden>
    <div class="bk-slot"></div>
    <section id="shop"></section>
  </div>

  <div class="view" id="view-exp" hidden>
    <section id="expView"></section>
  </div>

  <div class="view" id="view-plan" hidden>
    <section id="breakeven"></section>
  </div>

  <div class="view" id="view-tips" hidden>
    <section id="tips"></section>
  </div>

  <div id="syncLine"></div>
</div>

<div class="fab"><div class="inner">
  <button class="btn btn-primary btn-full" id="addMain"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> <span id="addMainText">Добавить банк</span></button>

  tipGroups:[{"i": "📘", "g": "How loans work", "items": [{"t": "Overpayment is the price of money", "d": "Look past the rate to how much you'll repay in total. Ask for the \"full cost of credit\" — with fees and insurance it's often far above the advertised rate."}, {"t": "Early on you mostly pay interest", "d": "With equal (annuity) payments, the first months go almost entirely to interest, not the debt. That's why paying early is most valuable at the start."}, {"t": "Long term = bigger overpayment", "d": "The longer the term, the smaller the payment but the more you repay. 600,000 at 18% over 2 years costs about 120,000 extra; over 10 years about 700,000."}, {"t": "The rule of 72", "d": "Divide 72 by the rate to see how many years it takes to double. Unpaid debt at 18% doubles in 4 years (72 ÷ 18)."}, {"t": "Insurance is often pushed on you", "d": "The bank may bundle insurance into the loan. Ask if you can decline it — that makes the loan cheaper."}, {"t": "Secured vs unsecured", "d": "With collateral (home, gold, car) the rate is lower, but a missed payment can cost you the asset. Unsecured is pricier, but you only risk money."}]}, {"i": "✅", "g": "Rules of a smart borrower", "items": [{"t": "Borrow only for what earns money", "d": "Stock for the business, education, housing — yes. Phones, gadgets, wants — no: they lose value while the debt stays."}, {"t": "The 30–40% rule", "d": "Total monthly loan payments should stay under about a third of income. More than that is the danger zone."}, {"t": "Read the contract before signing", "d": "Fees, penalties, insurance, early-repayment terms — the costly parts hide in the small print."}, {"t": "Borrow in the currency you earn", "d": "Income in somoni and a loan in dollars is risky: when the exchange rate rises, so does the debt."}, {"t": "Don't pay a loan with a loan", "d": "A new loan to close an old one almost always grows your total debt. It's a closed loop."}, {"t": "\"0%\" instalments are never free", "d": "The interest is usually built into the price. Ask: \"How much if I pay in full now?\" If it's cheaper, the instalment isn't free."}, {"t": "Be careful with instalments", "d": "Many small instalments quietly eat your budget. Count them as one big debt."}, {"t": "Don't co-sign \"as a favour\"", "d": "If they don't pay, you will. Your signature is your debt. Never hand your documents to anyone."}, {"t": "Run from payday loans", "d": "\"Quick money\" at huge rates is a straight road into a debt pit."}]}, {"i": "🎯", "g": "Getting out of debt", "items": [{"t": "Keep all debts in sight", "d": "For each loan, note the balance, payment, rate, term and collateral. Seeing the full picture makes planning easier — that's what this app is for."}, {"t": "Highest rate first (avalanche)", "d": "Pay the minimum on everything and put all spare money on the highest-rate loan. That saves the most."}, {"t": "Or smallest first (snowball)", "d": "Closing a small loan gives a quick win and motivation. Pick what suits you."}, {"t": "⭐ Roll the freed payment into the next debt", "d": "When a loan closes, don't spend the freed money. Send all of it to the next loan — debts start falling like dominoes."}, {"t": "Pay a little extra", "d": "Even a small extra payment noticeably cuts the term and overpayment. Check the \"Early\" calculator."}, {"t": "Don't invest while carrying 18% debt", "d": "Paying off an 18% loan is a guaranteed, risk-free 18% return. No deposit or business guarantees that."}, {"t": "Which debt matters most", "d": "① secured on your home → ② those that can reach court → ③ the most expensive → ④ family and friends. Pay the most dangerous, not the loudest."}, {"t": "Combine expensive loans", "d": "Ask about refinancing — several costly loans into one cheaper one. Just count the fees."}, {"t": "The goal matters more than the amount", "d": "Name the date you'll be debt-free and work toward it. The app shows it."}]}, {"i": "🏦", "g": "Dealing with the bank", "items": [{"t": "You can negotiate with the bank", "d": "Bank terms aren't law. You can ask for a lower rate, a deferral or restructuring. The bank would rather make a deal than lose money."}, {"t": "⭐ Can't pay? Go to the bank early", "d": "Before you miss a payment you're a client with a problem — the bank will talk. After, you're a debtor: penalties, court, collateral. Call BEFORE the due date."}, {"t": "Pay on time", "d": "Late payments add penalties that cost more than interest. Treat the payment as a must-pay at the start of the month."}, {"t": "Autopay protects you from fines", "d": "Set up automatic payments. One forgotten date means penalties and a bad credit history."}, {"t": "Check your balance once a year", "d": "Get a statement from the bank. Extra fees, missed payments and unwanted insurance do happen."}, {"t": "Credit history is money", "d": "Pay on time and banks lend more, more cheaply. One late payment can cost you a good rate later."}]}, {"i": "🏠", "g": "Pledging your home", "items": [{"t": "The less you borrow against it, the safer", "d": "If the loan is a third of the home's value, your safety margin is big. Banks usually lend 50–70% of the valuation."}, {"t": "The bank only takes what it's owed", "d": "If it comes to a sale, the bank takes the remaining debt plus costs and returns the rest of the money to you."}, {"t": "Only a real pledge agreement", "d": "Never sign a sale contract instead of a pledge — it's a scam that can cost you the home immediately."}, {"t": "Never pledge your home to private lenders", "d": "Only a reputable bank. People lose homes to private lenders and microfinance firms over small debts."}, {"t": "Don't risk your only home", "d": "Don't pledge it for a risky business. Ask yourself: could we still pay if income dropped by a third?"}, {"t": "Repossession is the last resort", "d": "A bank won't take the home over one missed payment — first notices, usually court. But forced sales fetch below market, so don't let it get there."}, {"t": "Gold — only as a function avaColor(n){ let h=0; for(const c of String(n)) h=(h+c.charCodeAt(0))%AVA.length; return AVA[h]; }

function clampDay(y,m,d){ const last=new Date(y,m+1,0).getDate(); return Math.min(d,last); }
function nextDueDate(dueDay,from){ from=from||new Date(); const t=new Date(from.getFullYear(),from.getMonth(),from.getDate());
  let y=t.getFullYear(),m=t.getMonth(),c=new Date(y,m,clampDay(y,m,dueDay)); if(c<t){ m+=1; if(m>11){m=0;y+=1;} c=new Date(y,m,clampDay(y,m,dueDay)); } return c; }
function daysUntil(d,from){ from=from||new Date(); const a=new Date(from.getFullYear(),from.getMonth(),from.getDate()); const b=new Date(d.getFullYear(),d.getMonth(),d.getDate()); return Math.round((b-a)/86400000); }
function fmtDate(d){ return d.getDate()+' '+MONTHS[lang].long[d.getMonth()]; }

function payoffSim(remaining, monthly, annualPct){
  if(remaining<=0) return {months:0, interest:0};
  if(monthly<=0) return null;
  const r=(annualPct||0)/100/12;
  if(r<=0) return {months:Math.ceil(remaining/monthly), interest:0};
  if(monthly <= remaining*r) return null;
  let bal=remaining, interest=0, months=0;
  while(bal>0 && months<1200){ const i=bal*r; interest+=i; bal=bal+i-monthly; months++; }
  return {months, interest:Math.max(0,Math.round(interest))};
}

const REMIND=7;
function analyze(loan){
  const total=Math.max(0,+loan.total||0), paid=Math.min(total,Math.max(0,+loan.paid||0)), remaining=Math.max(0,total-paid);
  const pct=total>0?Math.min(100,Math.round(paid/total*100)):0, done=remaining<=0, monthly=Math.max(0,+loan.monthly||0);
  const due=nextDueDate(loan.dueDay||1), days=daysUntil(due);
  let monthsLeft=null, interestLeft=0;
  if(!done && monthly>0){ const sim=payoffSim(remaining,monthly,+loan.rate||0); if(sim){ monthsLeft=sim.months; interestLeft=sim.interest; } }
  let urg='none'; if(!done){ if(days<=3)urg='urgent'; else if(days<=REMIND)urg='soon'; }
  return {total,paid,remaining,pct,done,monthly,due,days,monthsLeft,interestLeft,urg};
}

  return `<div class="ring ${cls||''}"><svg viewBox="0 0 48 48" aria-hidden="true"><circle class="ring-track" cx="24" cy="24" r="20"></circle><circle class="ring-fill" cx="24" cy="24" r="20" stroke-dasharray="${RC.toFixed(2)}" stroke-dashoffset="${RC.toFixed(2)}" data-off="${off.toFixed(2)}"></circle></svg><div class="ring-num"><b>${pct}</b><i>%</i></div></div>`; }
function animateRings(root){ const red=matchMedia('(prefers-reduced-motion: reduce)').matches;
  (root||document).querySelectorAll('.ring-fill').forEach(el=>{ const off=el.getAttribute('data-off'); if(red){el.style.strokeDashoffset=off;return;} requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style.strokeDashoffset=off;})); }); }
function encouragement(pct,has){ const e=L.enc; if(!has)return e.start; if(pct>=100)return e.p100; if(pct>=80)return e.p80; if(pct>=50)return e.p50; if(pct>=20)return e.p20; return e.p0; }

function celebrate(){ if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=document.createElement('canvas'); Object.assign(c.style,{position:'fixed',inset:'0',width:'100%',height:'100%',pointerEvents:'none',zIndex:95}); document.body.appendChild(c);
  const ctx=c.getContext('2d'),DPR=Math.min(2,devicePixelRatio||1); c.width=innerWidth*DPR; c.height=innerHeight*DPR;
  const cols=['#11805A','#2FB27E','#E08A2B','#5B6CF0','#E0557B','#2E8BE0'],ps=[];
  for(let i=0;i<90;i++) ps.push({x:innerWidth/2*DPR,y:innerHeight*0.3*DPR,vx:(Math.random()-0.5)*9*DPR,vy:(Math.random()*-9-4)*DPR,g:0.28*DPR,r:(4+Math.random()*5)*DPR,rot:Math.random()*6,vr:(Math.random()-0.5)*0.4,col:cols[i%cols.length]});
  const s=performance.now(); (function f(t){ const el=t-s; ctx.clearRect(0,0,c.width,c.height);
    for(const p of ps){ p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr; ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=Math.max(0,1-el/1600);ctx.fillStyle=p.col;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6);ctx.restore(); }
    if(el<1600)requestAnimationFrame(f); else c.remove(); })(s); }

function checkMilestone(list){

function buildChart(pts){
  const W=320,H=120,padT=10,padB=20,padX=8; const xs=pts.map(p=>p.ts),xmin=Math.min(...xs),xmax=Math.max(...xs),ymax=Math.max(...pts.map(p=>p.y),1),Yb=H-padB;
  const X=ts=>xmax===xmin?W/2:padX+(ts-xmin)/(xmax-xmin)*(W-2*padX), Y=v=>padT+(1-v/ymax)*(Yb-padT);
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(p.ts).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ');
  const area=`${line} L${X(xmax).toFixed(1)},${Yb} L${X(xmin).toFixed(1)},${Yb} Z`, last=pts[pts.length-1];
  const firstLabel=MONTHS[lang].short[new Date(xmin).getMonth()];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="chart"><defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--brand)" stop-opacity="0.22"></stop><stop offset="1" stop-color="var(--brand)" stop-opacity="0"></stop></linearGradient></defs><line class="gl" x1="${padX}" y1="${Yb}" x2="${W-padX}" y2="${Yb}"></line><path d="${area}" fill="url(#g1)"></path><path class="line" d="${line}"></path><circle class="dot" cx="${X(last.ts).toFixed(1)}" cy="${Y(last.y).toFixed(1)}" r="4"></circle><text x="${padX}" y="${H-6}">${firstLabel}</text><text x="${W-padX}" y="${H-6}" text-anchor="end">${L.now}</text></svg>`;
}
function renderDynamics(list){

}

function fileToIconDataURL(file){
  return new Promise((resolve,reject)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{ try{
      const size=120, c=document.createElement('canvas'); c.width=size; c.height=size;
      const ctx=c.getContext('2d');
      const s=Math.min(img.naturalWidth,img.naturalHeight), sx=(img.naturalWidth-s)/2, sy=(img.naturalHeight-s)/2;
      ctx.drawImage(img,sx,sy,s,s,0,0,size,size);
      URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg',0.82));
    }catch(err){ URL.revokeObjectURL(url); reject(err); } };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('img')); };
    img.src=url;
  });
}

  const sum=$('#c-sum'),rate=$('#c-rate'),term=$('#c-term'); let last=null;

    const r=an/100/12, pay=r>0?P*r/(1-Math.pow(1+r,-n)):P/n, total=pay*n, over=total-P; $('#co-pay').textContent=money(pay); $('#co-total').textContent=money(total); $('#co-over').textContent=money(over)+` · ${Math.round(over/P*100)}%`; last={P,pay:Math.round(pay)}; }

function convCalc(body){
  let cur='USD';
  function sub(){
    body.innerHTML=`<p class="lead" style="margin-top:-6px">${L.convSub}</p><div class="cur-pick">${Object.keys(CUR).map(c=>`<button data-c="${c}" class="${cur===c?'on':''}">${c}</button>`).join('')}</div><div class="two"><div class="field n"><label>${L.amountCur(cur)}</label><input id="cv-a" type="number" inputmode="decimal" min="0" placeholder="500"></div><div class="field n"><label>${L.rateOne(cur)}</label><input id="cv-r" type="number" inputmode="decimal" min="0" placeholder="${CUR[cur]}"></div></div><div class="calc-out"><div class="co-row big"><span>${L.inSomoni}</span><b id="cv-v">—</b></div></div>`;

function earlyCalc(body){
  body.innerHTML=`<p class="lead" style="margin-top:-6px">${L.earlySub}</p>
    <div class="two"><div class="field n"><label>${L.remainingDebt}</label><input id="e-rem" type="number" inputmode="numeric" min="0" placeholder="20000"></div><div class="field n"><label>${L.monthlyPayment}</label><input id="e-mon" type="number" inputmode="numeric" min="0" placeholder="2000"></div></div>

    <div class="calc-out"><div class="co-row"><span>${L.payoffEarlierBy}</span><b id="e-mo">—</b></div><div class="co-row big"><span>${L.saveOnInterest}</span><b id="e-sv">—</b></div></div>`;
  const rem=$('#e-rem'),mon=$('#e-mon'),rate=$('#e-rate'),extra=$('#e-extra');
  function calc(){ const R=+rem.value,M=+mon.value,an=+rate.value||0,ex=+extra.value||0;
    if(!(R>0)||!(M>0)){ $('#e-mo').textContent='—'; $('#e-sv').textContent='—'; return; }
    const base=payoffSim(R,M,an), fast=payoffSim(R,M+ex,an);
    if(!base||!fast){ $('#e-mo').textContent=L.tooSmall; $('#e-sv').textContent='—'; return; }
    const mo=Math.max(0,base.months-fast.months), sv=Math.max(0,base.interest-fast.interest);
    $('#e-mo').textContent=mo+' '+L.noun(mo,'month'); $('#e-sv').textContent=money(sv); }
  [rem,mon,rate,extra].forEach(e=>e.addEventListener('input',calc)); rem.focus();
}

/* ---- данные и безопасность ---- */
const BKKEY='bk_v1', BKSN='bksn_v1', BKRH='bkrh_v1';
let storagePersisted=false;
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lastBackup(){ const v=+lsGet(BKKEY); return v>0?v:0; }
function markBackup(){ lsSet(BKKEY,String(Date.now())); lsSet(BKSN,'0'); renderBackupNudge(); }
function hasRealData(){ const sh=state.shop||{}; return state.loans.some(l=>!l.example)||!!(sh.exp&&sh.exp.length)||!!(sh.sales&&sh.sales.length)||!!(state.profile&&(state.profile.first||state.profile.last)); }
function onlyExamples(){ return state.loans.length>0 && state.loans.every(l=>l.example) && !hasRealData(); }
function bkDays(ts){ const a=new Date(ts); a.setHours(0,0,0,0); const b=new Date(); b.setHours(0,0,0,0); return Math.round((b-a)/86400000); }
function bkAgoText(ts){ const n=bkDays(ts); return n<=0?L.bkToday:n===1?L.bkYesterday:L.bkDaysAgo.replace('{n}',n); }
function bkDue(){ const last=lastBackup(); return hasRealData() && (!last || bkDays(last)>=7) && Date.now()>(+lsGet(BKSN)||0); }
function bkFileName(){ return 'my-credits-backup-'+dkey()+'.txt'; }
async function shareBackup(){
  const data=backupData();
  try{
    const f=new File([data],bkFileName(),{type:'text/plain'});
    if(navigator.canShare && navigator.share && navigator.canShare({files:[f]})){
      await navigator.share({files:[f], title:L.appName, text:L.bkShareText});
      markBackup(); toast(L.bkSaved); return;
    }
  }catch(e){ if(e && e.name==='AbortError') return; }
  downloadBackup();
}
function downloadBackup(){
  try{
    const url=URL.createObjectURL(new Blob([backupData()],{type:'text/plain'}));
    const a=document.createElement('a'); a.href=url; a.download=bkFileName(); a.style.display='none';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),5000);
    markBackup(); toast(L.bkDownloaded);
  }catch(e){ toast(L.bkFail); }
}
function doRestore(str){
  let o; try{ o=JSON.parse(String(str).trim()); if(!o||!Array.isArray(o.loans)) throw 0; }catch(e){ toast(L.errBadBackup); return false; }
  const go=()=>{ restoreData(JSON.stringify(o)); closeSheet(); render(); toast(L.dataRestored); };
  if(hasRealData()){
    openSheet(`<h3>${L.bkReplaceQ}</h3><p class="lead">${L.bkReplaceSub}${o.at>0?' '+L.bkFileFrom.replace('{d}',fmtDate(new Date(o.at))):''}</p><div class="sheet-row" style="margin-top:16px"><button class="btn btn-ghost" data-close>${L.cancel}</button><button class="btn btn-primary" id="rs-go">${L.bkReplaceBtn}</button></div>`);
    $('#rs-go').onclick=go;
  } else go();
  return true;
}
function pickBackupFile(){
  const inp=document.createElement('input'); inp.type='file'; inp.style.display='none';
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; inp.remove(); if(!f) return; const r=new FileReader(); r.onload=()=>doRestore(r.result); r.onerror=()=>toast(L.errBadBackup); r.readAsText(f); };
  document.body.appendChild(inp); inp.click();
}
function renderBackupNudge(){
  const ex=onlyExamples() && lsGet(BKRH)!=='1', due=!ex && bkDue(), last=lastBackup();
  document.querySelectorAll('.bk-slot').forEach(box=>{
    if(ex && box.dataset.restore){
      box.innerHTML=`<div class="bkn rs"><div class="bkn-t"><span class="ic">🗂️</span><div><b>${L.bkRestoreTitle}</b><span class="s">${L.bkRestoreSub}</span></div></div><div class="bkn-a"><button class="btn btn-primary" data-bk="pick">${L.bkRestorePick}</button><button class="btn btn-ghost" data-bk="new">${L.bkNewUser}</button></div></div>`;
    } else if(due){
      box.innerHTML=`<div class="bkn"><div class="bkn-t"><span class="ic">🛡️</span><div><b>${last?L.bkRemindOld.replace('{d}',bkAgoText(last)):L.bkRemindNever}</b><span class="s">${L.bkRemindSub}</span></div></div><div class="bkn-a"><button class="btn btn-primary" data-bk="share">${L.bkNow}</button><button class="btn btn-ghost" data-bk="later">${L.bkLater}</button></div></div>`;
    } else box.innerHTML='';
  });
}
async function askPersist(){
  try{ if(navigator.storage && navigator.storage.persist){ storagePersisted=await navigator.storage.persisted(); if(!storagePersisted) storagePersisted=await navigator.storage.persist(); } }catch(e){}
}
function backupData(){ return JSON.stringify({v:4, at:Date.now(), loans:state.loans, payments:state.payments, gold:state.gold, shop:state.shop, profile:state.profile, be:beLoad()}); }
function restoreData(str){ const o=JSON.parse(str); if(!o||!Array.isArray(o.loans)) throw new Error('bad'); state.loans=o.loans; state.payments=Array.isArray(o.payments)?o.payments:[]; state.gold=o.gold||null; state.shop=(o.shop&&Array.isArray(o.shop.exp))?o.shop:{exp:[],sales:[]}; if(o.profile) state.profile=o.profile; if(o.be&&typeof o.be==='object') beSaveCfg(o.be); if(o.at>0) lsSet(BKKEY,String(o.at)); persist(); }
function hashPin(p){ let h=5381; for(const c of String(p)) h=((h<<5)+h+c.charCodeAt(0))>>>0; return 'h'+h; }
function getPin(){ try{return localStorage.getItem('pin_v1')||'';}catch(e){return'';} }
function setPinVal(p){ try{localStorage.setItem('pin_v1',hashPin(p));}catch(e){} }
function clearPin(){ try{localStorage.removeItem('pin_v1');}catch(e){} }

  $('#bk-restore').onclick=()=>{ const v=$('#bk-in').value.trim(); if(!v) return showErr($('#bk-err'),L.errPasteBackup); try{ restoreData(v); closeSheet(); render(); toast(L.dataRestored); }catch(e){ showErr($('#bk-err'),L.errBadBackup); } };

  if($('#pin-change')) $('#pin-change').onclick=()=>pinSet();

    if(a==='beedit'){ beEditForm(); return; }
    const loan=byId(act.dataset.id); if(!loan) return;
    if(a==='open') detailSheet(loan); if(a==='pay') payForm(loan); if(a==='edit') loanForm(loan); if(a==='del') confirmDelete(loan); return; }
  if(e.target.closest('#langTop')) langSheet();
  if(e.target.closest('#dataTop')) dataSheet();
  if(e.target.closest('#calcTop')) calcSheet();
  if(e.target.closest('#addTop')||e.target.closest('#addMain')||e.target.closest('#addEmpty')) loanForm(null);
  if(e.target.closest('#tipsAll')) tipsSheet();
  if(e.target.closest('#tipNext')){ tipIdx++; renderTips(); return; }
  const bk=e.target.closest('[data-bk]'); if(bk){ const k=bk.dataset.bk; if(k==='share') shareBackup(); else if(k==='dl') downloadBackup(); else if(k==='pick') pickBackupFile(); else if(k==='later'){ lsSet(BKSN,String(Date.now()+86400000)); renderBackupNudge(); } else if(k==='new'){ lsSet(BKRH,'1'); renderBackupNudge(); } return; }
  if(e.target.closest('#clearEx')){ state.loans=[]; state.payments=[]; state.gold=null; persist(); render(); toast(L.saved); loanForm(null); }
});
document.addEventListener('keydown', e=>{ if((e.key==='Enter'||e.key===' ') && e.target.matches('.card[data-action]')){ e.preventDefault(); e.target.click(); } });

let tt; function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2200); }

/* ===== PWA: установка на телефон и офлайн ===== */
let deferredPrompt=null;
function renderInstall(){
  const bar=document.getElementById('installBar'); if(!bar) return;
  bar.innerHTML = deferredPrompt
    ? `<div class="install"><span style="font-size:1.3rem">📲</span><span class="it">${L.installText}</span><button class="ib" id="installBtn">${L.install}</button><button class="ix" id="installX" aria-label="×">✕</button></div>`
    : '';
}
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredPrompt=e; renderInstall(); });
window.addEventListener('appinstalled', ()=>{ askPersist(); deferredPrompt=null; renderInstall(); toast(L.installedMsg); });
document.addEventListener('click', async e=>{
  if(e.target.closest('#installX')){ deferredPrompt=null; renderInstall(); return; }
  if(e.target.closest('#installBtn') && deferredPrompt){ const p=deferredPrompt; deferredPrompt=null; renderInstall(); try{ p.prompt(); await p.userChoice; }catch(_){} }
});
function initPWA(){ renderInstall(); askPersist(); if('serviceWorker' in navigator){ navigator.serviceWorker.register('service-worker.js').catch(()=>{}); } }

applyStatic();
render();
setTab(curTab);
maybeLock();
initPWA();
</script>
